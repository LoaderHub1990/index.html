<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 Our Memory Space</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-light: #ffd1dc;
    --blue-light: #b3e5fc;
    --white: #ffffff;
    --text-pink: #ff85a2;
    --text-blue: #64b5f6;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--pink-light) 0%, var(--white) 50%, var(--blue-light) 100%);
    font-family: 'Sarabun', sans-serif;
    overflow-x: hidden;
    color: #555;
  }

  /* หน้ากากกดเข้าเว็บ */
  #overlay {
    position: fixed; inset: 0;
    background: white;
    display: flex; justify-content: center; align-items: center;
    z-index: 9999; transition: 0.8s;
  }
  .start-btn {
    padding: 15px 40px; font-size: 1.2rem;
    background: var(--text-pink); color: white;
    border: none; border-radius: 30px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(255,133,162,0.4);
  }

  /* ปุ่มควบคุมเพลงด้านขวา */
  .music-control {
    position: fixed; top: 20px; right: 20px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.7);
    width: 45px; height: 45px;
    border-radius: 50%; display: flex;
    justify-content: center; align-items: center;
    cursor: pointer; border: 2px solid var(--text-pink);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    font-size: 1.2rem;
  }

  .container {
    position: relative; z-index: 10;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
    transition: 0.5s;
  }

  .love-card {
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(15px);
    border-radius: 30px; padding: 40px;
    max-width: 600px; width: 100%;
    text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.05);
  }

  /* การจัดวางรูปภาพเล็กๆ */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px; margin-top: 25px;
    display: none; /* ซ่อนไว้ก่อน */
  }
  .small-img {
    width: 100%; aspect-ratio: 1;
    border-radius: 15px; object-fit: cover;
    border: 3px solid white;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    transition: 0.3s;
  }
  .small-img:hover { transform: scale(1.05); }

  .nav-btn {
    margin-top: 25px; padding: 10px 25px;
    background: white; color: var(--text-blue);
    border: 2px solid var(--text-blue);
    border-radius: 20px; cursor: pointer;
    font-weight: 600; transition: 0.3s;
  }
  .nav-btn:hover { background: var(--text-blue); color: white; }

  .hidden { display: none; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
</style>
</head>
<body>

<div id="overlay">
  <button class="start-btn" onclick="init()">ยินดีต้อนรับ ✨</button>
</div>

<div class="music-control" onclick="toggleMusic()" id="musicBtn">🎵</div>

<audio id="bgMusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="container" id="content-1">
  <div class="love-card">
    <img src="https://via.placeholder.com/150/ff85a2/ffffff?text=Main+Photo" style="width:150px; height:150px; border-radius:50%; margin-bottom:20px; border:5px solid white; animation: float 3s ease-in-out infinite;">
    <h1 style="color:var(--text-pink); font-family: 'Playfair Display', serif;">Our Happiness</h1>
    <p style="margin: 15px 0;">นี่คือจุดเริ่มต้นของเรื่องราวเล็กๆ ของเรา</p>
    <button class="nav-btn" onclick="nextPage()">ดูรูปภาพถัดไป ➔</button>
  </div>
</div>

<div class="container hidden" id="content-2">
  <div class="love-card">
    <h2 style="color:var(--text-blue); margin-bottom: 20px;">Memories Gallery</h2>
    
    <div class="photo-grid" id="gallery" style="display: grid;">
      <img src="https://via.placeholder.com/100/ffd1dc" class="small-img">
      <img src="https://via.placeholder.com/100/b3e5fc" class="small-img">
      <img src="https://via.placeholder.com/100/ffffff" class="small-img">
      <img src="https://via.placeholder.com/100/ff85a2" class="small-img">
      <img src="https://via.placeholder.com/100/64b5f6" class="small-img">
      <img src="https://via.placeholder.com/100/fce4ec" class="small-img">
    </div>

    <button class="nav-btn" onclick="prevPage()" style="border-color: var(--text-pink); color: var(--text-pink); margin-top:30px;">ย้อนกลับ</button>
  </div>
</div>

<script>
const music = document.getElementById('bgMusic');
let isPlaying = false;

function init() {
  document.getElementById('overlay').style.opacity = '0';
  setTimeout(() => document.getElementById('overlay').style.display = 'none', 800);
  music.play();
  isPlaying = true;
  document.getElementById('musicBtn').textContent = '⏸️';
}

function toggleMusic() {
  if (isPlaying) {
    music.pause();
    document.getElementById('musicBtn').textContent = '▶️';
  } else {
    music.play();
    document.getElementById('musicBtn').textContent = '⏸️';
  }
  isPlaying = !isPlaying;
}

function nextPage() {
  document.getElementById('content-1').classList.add('hidden');
  document.getElementById('content-2').classList.remove('hidden');
}

function prevPage() {
  document.getElementById('content-2').classList.add('hidden');
  document.getElementById('content-1').classList.remove('hidden');
}
</script>

</body>
</html>
