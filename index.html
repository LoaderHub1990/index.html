<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 Our Sweet Memory</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-light: #ffd1dc;
    --blue-light: #b3e5fc;
    --white: #ffffff;
    --text-pink: #ff85a2;
    --text-blue: #64b5f6;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    /* พื้นหลังโทน ชมพู ขาว ฟ้า ละมุนๆ */
    background: linear-gradient(135deg, var(--pink-light) 0%, var(--white) 50%, var(--blue-light) 100%);
    font-family: 'Sarabun', sans-serif;
    overflow-x: hidden;
    color: #555;
  }

  /* หน้ากากกดเข้าเว็บเพื่อเล่นเพลง */
  #overlay {
    position: fixed; inset: 0;
    background: white;
    display: flex; justify-content: center; align-items: center;
    z-index: 9999; transition: 0.8s;
  }
  .start-btn {
    padding: 15px 40px; font-size: 1.2rem;
    background: var(--text-pink); color: white;
    border: none; border-radius: 30px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(255,133,162,0.4);
  }

  /* ตกแต่งรูปภาพ */
  .profile-container {
    position: relative; margin-bottom: 20px;
    opacity: 0; animation: fadeIn 1.2s ease 1s forwards;
  }
  .profile-img {
    width: 180px; height: 180px;
    border-radius: 50%;
    border: 6px solid white;
    box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    object-fit: cover;
    animation: float 4s ease-in-out infinite;
  }

  /* อนิเมชั่นรูปลอย */
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .container {
    position: relative; z-index: 10;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
  }

  .main-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    background: linear-gradient(90deg, var(--text-pink), var(--text-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.05));
  }

  .love-card {
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 30px;
    padding: 40px;
    max-width: 600px; width: 100%;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.05);
    opacity: 0; animation: fadeUp 1.4s ease 0.5s forwards;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  .message { line-height: 1.8; color: #666; margin: 20px 0; }
  .confession { font-size: 1.8rem; color: var(--text-pink); font-weight: bold; }

  /* Floating Hearts */
  .heart-particle {
    position: fixed; pointer-events: none;
    z-index: 1; animation: floatUp linear forwards;
  }
  @keyframes floatUp {
    from { transform: translateY(100vh) rotate(0deg); opacity: 1; }
    to { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<div id="overlay">
  <button class="start-btn" onclick="init()">เปิดดูความทรงจำ 🌸</button>
</div>

<audio id="bgMusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="profile-container">
    <img src="https://cdn.pixabay.com/photo/2017/08/30/12/45/girl-2696947_1280.jpg" alt="You" class="profile-img">
  </div>

  <div class="love-card">
    <h1 class="main-title">To Someone Special</h1>
    <p class="message">
      ขอบคุณที่เข้ามาเป็นเรื่องราวดีๆ ในทุกๆ วัน<br>
      ท้องฟ้าวันนี้ดูสวยขึ้นเมื่อมีเธออยู่ข้างๆ<br>
      <strong>ขอให้รอยยิ้มของเธอสดใสแบบนี้ตลอดไปนะ</strong>
    </p>
    <p class="confession">รักนะ...เจ้าความรัก 💕</p>
    
    <div style="margin-top: 20px; color: var(--text-blue); font-size: 0.9rem;">
      ♫ กำลังเล่นเพลงที่คุณชอบ...
    </div>
  </div>
</div>

<script>
// ฟังก์ชันเริ่มทำงานเมื่อกดปุ่ม
function init() {
  // ซ่อนหน้ากาก
  const overlay = document.getElementById('overlay');
  overlay.style.opacity = '0';
  setTimeout(() => overlay.style.display = 'none', 800);

  // เริ่มเล่นเพลง
  const music = document.getElementById('bgMusic');
  music.play().catch(err => console.log("Autoplay error: ", err));

  // เริ่มสร้างหัวใจ
  setInterval(createHeart, 500);
}

// ฟังก์ชันสร้างหัวใจลอยๆ
function createHeart() {
  const heart = document.createElement('div');
  const emojis = ['🌸', '✨', '💖', '☁️', '❄️'];
  heart.className = 'heart-particle';
  heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
  heart.style.duration = (Math.random() * 3 + 4) + 's';
  heart.style.animation = `floatUp ${heart.style.duration} linear forwards`;
  
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}
</script>

</body>
</html>
