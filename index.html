<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Sweet Memory</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-light: #ffd1dc;
    --blue-light: #b3e5fc;
    --white: #ffffff;
    --text-pink: #ff85a2;
    --text-blue: #64b5f6;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    /* ไล่เฉดสี ชมพู ขาว ฟ้า ละมุนๆ */
    background: linear-gradient(135deg, var(--pink-light) 0%, var(--white) 50%, var(--blue-light) 100%);
    font-family: 'Sarabun', sans-serif;
    color: #555;
    overflow: hidden;
  }

  /* Overlay ก่อนเข้าหน้าเว็บเพื่อให้เพลงเล่นได้ */
  #overlay {
    position: fixed; inset: 0;
    background: white;
    display: flex; justify-content: center; align-items: center;
    z-index: 9999; transition: 0.8s ease;
  }
  .start-btn {
    padding: 15px 40px; font-size: 1.1rem;
    background: var(--text-pink); color: white;
    border: none; border-radius: 30px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(255,133,162,0.3);
    transition: 0.3s;
  }
  .start-btn:hover { transform: scale(1.05); }

  /* ปุ่มควบคุมเพลงมุมขวา */
  .music-control {
    position: fixed; top: 20px; right: 20px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.8);
    width: 45px; height: 45px;
    border-radius: 50%; display: flex;
    justify-content: center; align-items: center;
    cursor: pointer; border: 2px solid var(--text-pink);
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    font-size: 1.2rem;
  }

  .container {
    height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
  }

  .love-card {
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(15px);
    border-radius: 30px; padding: 40px;
    max-width: 500px; width: 100%;
    text-align: center; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.05);
    border: 1px solid rgba(255,255,255,0.8);
  }

  /* จัดการรูปเล็ก 3 รูปในหน้า 2 */
  .photo-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px; margin-top: 25px;
  }
  .small-img {
    width: 100%; aspect-ratio: 1/1.2;
    border-radius: 15px; object-fit: cover;
    border: 4px solid white;
    box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    transition: 0.3s;
  }
  .small-img:hover { transform: scale(1.08); }

  .nav-btn {
    margin-top: 25px; padding: 10px 30px;
    background: transparent; color: var(--text-pink);
    border: 2px solid var(--text-pink);
    border-radius: 25px; cursor: pointer;
    font-weight: 600; transition: 0.3s;
  }
  .nav-btn:hover { background: var(--text-pink); color: white; }

  .hidden { display: none; opacity: 0; pointer-events: none; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .main-img {
    width: 160px; height: 160px; border-radius: 50%;
    margin-bottom: 20px; border: 6px solid white;
    animation: float 4s ease-in-out infinite;
    object-fit: cover;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>

<div id="overlay">
  <button class="start-btn" onclick="init()">เปิดดูเรื่องราวของเรา 🌸</button>
</div>

<div class="music-control" onclick="toggleMusic()" id="musicBtn">🎵</div>

<audio id="bgMusic" loop>
  <source src="https://cdn.discordapp.com/attachments/1492359220731969819/1503809175208067072/93d50f82afafdbcc.mp3" type="audio/mpeg">
</audio>

<div class="container" id="page-1">
  <div class="love-card">
    <img src="https://media.discordapp.net/attachments/1492359220731969819/1503809539860861019/Screenshot_2026-05-13_001004.png" class="main-img">
    <h1 style="color:var(--text-pink); font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 10px;">Hello, You.</h1>
    <p style="margin-bottom: 20px; color: #888; font-weight: 300;">วันที่ท้องฟ้าสดใสเหมือนรอยยิ้มของคุณ</p>
    <button class="nav-btn" onclick="goToPage(2)">ดูรูปภาพของเรา ➔</button>
  </div>
</div>

<div class="container hidden" id="page-2">
  <div class="love-card">
    <h2 style="color:var(--text-blue); margin-bottom: 20px; font-family: 'Playfair Display', serif;">Our Moments</h2>
    
    <div class="photo-grid-3">
      <img src="https://cdn.discordapp.com/attachments/1492359220731969819/1503809539860861019/Screenshot_2026-05-13_001004.png" class="small-img">
      <img src="https://media.discordapp.net/attachments/1492359220731969819/1503809539860861019/Screenshot_2026-05-13_001004.png" class="small-img">
      <img src="https://media.discordapp.net/attachments/1492359220731969819/1503809540196532306/Screenshot_2026-05-13_001144.png" class="small-img">
    </div>

    <button class="nav-btn" onclick="goToPage(1)" style="border-color: #ccc; color: #999;">ย้อนกลับ</button>
  </div>
</div>

<script>
const music = document.getElementById('bgMusic');
let isPlaying = false;

function init() {
  const overlay = document.getElementById('overlay');
  overlay.style.opacity = '0';
  setTimeout(() => overlay.style.display = 'none', 800);
  music.play();
  isPlaying = true;
  document.getElementById('musicBtn').textContent = '⏸️';
}

function toggleMusic() {
  if (isPlaying) {
    music.pause();
    document.getElementById('musicBtn').textContent = '▶️';
  } else {
    music.play();
    document.getElementById('musicBtn').textContent = '⏸️';
  }
  isPlaying = !isPlaying;
}

function goToPage(pageNumber) {
  if (pageNumber === 2) {
    document.getElementById('page-1').classList.add('hidden');
    document.getElementById('page-2').classList.remove('hidden');
  } else {
    document.getElementById('page-2').classList.add('hidden');
    document.getElementById('page-1').classList.remove('hidden');
  }
}
</script>

</body>
</html>
