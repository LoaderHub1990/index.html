<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 ม่อนตอบหน่อยนะ</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,400&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --rose: #e8a0b4;
  --rose-deep: #c9627a;
  --rose-light: #fce4ec;
  --blush: #fff0f5;
  --sky: #b3d9f5;
  --sky-deep: #5b9ec9;
  --cream: #fdf8f5;
  --gold: #d4a96a;
  --lilac: #d8c2f0;
  --lilac-deep: #9b6fcf;
  --mint: #a8e6cf;
  --text-dark: #2d1f28;
  --text-mid: #7a5a68;
  --text-light: #b9909a;
  --glass: rgba(255,255,255,0.55);
  --glass-border: rgba(255,255,255,0.85);
  --shadow-rose: rgba(201,98,122,0.12);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  min-height: 100vh;
  background: var(--cream);
  font-family: 'Sarabun', sans-serif;
  color: var(--text-dark);
  overflow-x: hidden;
}

/* ── BG AURORA ── */
.aurora-bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(232,160,180,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 80% 20%, rgba(216,194,240,0.15) 0%, transparent 55%),
    radial-gradient(ellipse 60% 70% at 50% 80%, rgba(179,217,245,0.13) 0%, transparent 60%),
    radial-gradient(ellipse 90% 40% at 10% 90%, rgba(168,230,207,0.10) 0%, transparent 50%),
    linear-gradient(160deg, #fdf8f5 0%, #fef0f6 40%, #f5f0ff 70%, #f0f8ff 100%);
  animation: aurora-shift 20s ease-in-out infinite alternate;
}
@keyframes aurora-shift {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(15deg); }
}

/* ── PARTICLES ── */
#particles-canvas {
  position: fixed; inset: 0; z-index: 1;
  pointer-events: none;
}

/* ── OVERLAY ── */
#overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  background: linear-gradient(160deg, #fdf8f5 0%, #fef0f6 45%, #f5f0ff 80%, #f0f8ff 100%);
  transition: opacity 1.4s cubic-bezier(.4,0,.2,1);
}
#overlay.fade-out { opacity: 0; pointer-events: none; }

.ov-ring {
  width: 130px; height: 130px; border-radius: 50%;
  border: 1.5px solid rgba(232,160,180,0.4);
  display: flex; align-items: center; justify-content: center;
  position: relative; margin-bottom: 32px;
  animation: ring-pulse 3s ease-in-out infinite;
}
.ov-ring::before, .ov-ring::after {
  content: ''; position: absolute; border-radius: 50%; border: 1px solid rgba(216,194,240,0.3);
}
.ov-ring::before { inset: -14px; animation: ring-pulse 3s ease-in-out infinite 0.5s; }
.ov-ring::after { inset: -28px; animation: ring-pulse 3s ease-in-out infinite 1s; }
@keyframes ring-pulse {
  0%,100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.04); opacity: 1; }
}

.ov-icon {
  font-size: 3.8rem;
  filter: drop-shadow(0 8px 24px rgba(200,98,122,0.25));
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.ov-tagline {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem; font-weight: 300; font-style: italic;
  color: var(--text-light); letter-spacing: 0.06em;
  margin-bottom: 6px; text-align: center;
}
.ov-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.65rem; font-weight: 300;
  color: var(--text-mid); letter-spacing: 0.04em;
  text-align: center; line-height: 1.5;
  padding: 0 24px; margin-bottom: 40px;
}
.ov-title strong { font-weight: 500; color: var(--rose-deep); }

.start-btn {
  position: relative; overflow: hidden;
  padding: 15px 52px;
  font-family: 'Sarabun', sans-serif;
  font-size: 0.95rem; font-weight: 500;
  letter-spacing: 0.12em; color: white;
  border: none; border-radius: 60px; cursor: pointer;
  background: linear-gradient(135deg, #d4607a 0%, #c0507a 40%, #9b6fcf 100%);
  box-shadow: 0 8px 32px rgba(200,80,122,0.35), 0 2px 8px rgba(155,111,207,0.2);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.start-btn::before {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 70%; height: 100%;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.22), transparent);
  animation: shimmer 2.8s ease-in-out infinite;
}
@keyframes shimmer { to { left: 160%; } }
.start-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(200,80,122,0.42), 0 4px 12px rgba(155,111,207,0.25); }
.start-btn:active { transform: translateY(-1px); }

/* ── MUSIC ── */
.music-control {
  position: fixed; top: 20px; right: 20px; z-index: 1000;
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(232,160,180,0.35);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.1rem;
  box-shadow: 0 4px 20px rgba(200,98,122,0.12);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.music-control:hover { transform: scale(1.1); box-shadow: 0 8px 28px rgba(200,98,122,0.22); }

/* ── MAIN APP ── */
#app {
  position: relative; z-index: 2;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 60px 20px;
}

/* ── PROGRESS ── */
.progress-wrap {
  width: 100%; max-width: 560px;
  margin-bottom: 28px;
}
.progress-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.progress-step {
  font-size: 0.78rem; font-weight: 500;
  color: var(--rose-deep); letter-spacing: 0.08em;
  text-transform: uppercase;
}
.progress-pct {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.9rem; color: var(--text-light);
}
.progress-track {
  position: relative; height: 3px;
  background: rgba(232,160,180,0.15);
  border-radius: 10px; overflow: visible;
}
.progress-fill {
  height: 100%; border-radius: 10px;
  background: linear-gradient(to right, #e8a0b4, #c9627a, #9b6fcf);
  transition: width 0.7s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.progress-fill::after {
  content: '';
  position: absolute; right: -4px; top: 50%;
  transform: translateY(-50%);
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--rose-deep);
  box-shadow: 0 0 0 3px rgba(201,98,122,0.2);
}

/* ── CARD ── */
.quiz-card {
  position: relative; overflow: hidden;
  width: 100%; max-width: 560px;
  background: rgba(255,255,255,0.62);
  backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  border-radius: 32px;
  padding: 44px 40px;
  border: 1px solid rgba(255,255,255,0.88);
  box-shadow:
    0 32px 80px rgba(201,98,122,0.09),
    0 8px 24px rgba(201,98,122,0.06),
    0 1px 0 rgba(255,255,255,0.95) inset;
  animation: card-enter 0.55s cubic-bezier(.22,1,.36,1) both;
}

@keyframes card-enter {
  from { opacity: 0; transform: translateY(30px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.card-glow {
  position: absolute; pointer-events: none;
  top: -60%; left: -30%;
  width: 160%; height: 160%;
  background: radial-gradient(ellipse at 30% 30%, rgba(216,194,240,0.14) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 70%, rgba(179,217,245,0.10) 0%, transparent 60%);
}

/* ── QUESTION HEADER ── */
.q-eyebrow {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.q-num-badge {
  font-size: 0.72rem; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--rose-deep);
  background: rgba(232,160,180,0.12);
  border: 1px solid rgba(201,98,122,0.2);
  border-radius: 20px;
  padding: 3px 12px;
}
.q-dot-line {
  flex: 1; height: 1px;
  background: linear-gradient(to right, rgba(232,160,180,0.3), transparent);
}

.q-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.1rem; font-weight: 300;
  line-height: 1.28; letter-spacing: -0.01em;
  color: var(--text-dark);
  margin-bottom: 30px;
}
.q-text em { font-style: italic; color: var(--rose-deep); font-weight: 300; }

/* ── DIVIDER ── */
.divider {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 22px;
}
.d-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, rgba(232,160,180,0.35), transparent); }
.d-gem {
  width: 6px; height: 6px;
  background: var(--rose);
  transform: rotate(45deg);
  border-radius: 1px;
}

/* ── SINGLE CHOICE ── */
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }

.opt-btn {
  position: relative; overflow: hidden;
  padding: 15px 20px 15px 20px;
  border-radius: 18px;
  border: 1px solid rgba(232,160,180,0.22);
  background: rgba(255,255,255,0.45);
  color: var(--text-mid);
  font-family: 'Sarabun', sans-serif;
  font-size: 0.95rem; font-weight: 400;
  cursor: pointer; text-align: left;
  transition: all 0.28s cubic-bezier(.4,0,.2,1);
  display: flex; align-items: center; gap: 12px;
}

.opt-icon {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(232,160,180,0.1);
  border: 1px solid rgba(232,160,180,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
  transition: all 0.28s ease;
}

.opt-text { flex: 1; }
.opt-arr {
  font-size: 0.8rem; color: var(--text-light);
  opacity: 0; transition: opacity 0.2s, transform 0.2s;
  transform: translateX(-4px);
}

.opt-btn:hover {
  border-color: rgba(201,98,122,0.4);
  background: rgba(255,255,255,0.7);
  transform: translateX(5px);
  box-shadow: 0 6px 20px rgba(201,98,122,0.1);
  color: var(--rose-deep);
}
.opt-btn:hover .opt-icon {
  background: rgba(201,98,122,0.12);
  border-color: rgba(201,98,122,0.3);
}
.opt-btn:hover .opt-arr { opacity: 1; transform: translateX(0); }

.opt-btn.selected {
  background: linear-gradient(135deg, rgba(232,160,180,0.22) 0%, rgba(216,194,240,0.15) 100%);
  border-color: rgba(201,98,122,0.45);
  color: var(--rose-deep);
  font-weight: 500;
  box-shadow: 0 8px 28px rgba(201,98,122,0.15);
  transform: translateX(5px);
}
.opt-btn.selected .opt-icon {
  background: linear-gradient(135deg, var(--rose-deep), var(--lilac-deep));
  border-color: transparent;
  color: white; font-size: 0.85rem;
}
.opt-btn.selected .opt-arr { opacity: 0; }

/* ── SCALE ── */
.scale-row {
  display: flex; gap: 8px; justify-content: center;
  margin-bottom: 12px;
}
.scale-btn {
  width: 56px; height: 56px; border-radius: 50%;
  border: 1px solid rgba(232,160,180,0.3);
  background: rgba(255,255,255,0.5);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.25rem; font-weight: 300;
  color: var(--text-mid);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.scale-btn:hover {
  border-color: var(--rose);
  color: var(--rose-deep);
  transform: scale(1.1) translateY(-3px);
  box-shadow: 0 8px 20px rgba(201,98,122,0.18);
}
.scale-btn.selected {
  background: linear-gradient(135deg, var(--rose-deep) 0%, var(--lilac-deep) 100%);
  border-color: transparent;
  color: white;
  transform: scale(1.15) translateY(-4px);
  box-shadow: 0 10px 30px rgba(201,98,122,0.32);
  font-weight: 500;
}
.scale-labels {
  display: flex; justify-content: space-between;
  font-size: 0.73rem; color: var(--text-light);
  letter-spacing: 0.05em; margin-bottom: 28px;
  padding: 0 4px;
}

/* ── TEXTAREA ── */
.text-input {
  width: 100%; padding: 16px 20px;
  border-radius: 18px;
  border: 1px solid rgba(232,160,180,0.28);
  background: rgba(255,255,255,0.55);
  font-family: 'Sarabun', sans-serif;
  font-size: 0.95rem; color: var(--text-dark);
  line-height: 1.7;
  resize: vertical; min-height: 100px;
  outline: none; margin-bottom: 28px;
  transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}
.text-input::placeholder { color: var(--text-light); }
.text-input:focus {
  border-color: rgba(201,98,122,0.5);
  background: rgba(255,255,255,0.75);
  box-shadow: 0 0 0 4px rgba(232,160,180,0.12);
}

/* ── NAV ── */
.nav-row {
  display: flex; gap: 10px; justify-content: flex-end; align-items: center;
}
.btn-back {
  padding: 12px 26px; border-radius: 50px;
  border: 1px solid rgba(180,160,170,0.3);
  background: transparent; color: var(--text-light);
  font-family: 'Sarabun', sans-serif;
  font-size: 0.88rem; letter-spacing: 0.06em;
  cursor: pointer; transition: all 0.28s ease;
}
.btn-back:hover { border-color: var(--rose); color: var(--rose-deep); }

.btn-next {
  position: relative; overflow: hidden;
  padding: 13px 34px; border-radius: 50px; border: none;
  background: linear-gradient(135deg, #d4607a 0%, #c0507a 45%, #9b6fcf 100%);
  color: white;
  font-family: 'Sarabun', sans-serif;
  font-size: 0.9rem; font-weight: 500; letter-spacing: 0.09em;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(200,80,122,0.3);
  transition: all 0.3s ease;
}
.btn-next::after {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
  animation: shimmer 2.5s ease-in-out infinite;
}
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(200,80,122,0.4); }
.btn-next:active { transform: translateY(0); }
.btn-next:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

/* ── THANK YOU ── */
#thank-you {
  display: none; text-align: center;
  animation: card-enter 0.6s cubic-bezier(.22,1,.36,1) both;
}
.ty-heart {
  font-size: 5rem; margin-bottom: 12px;
  animation: float 3s ease-in-out infinite;
  display: block;
}
.ty-h {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.4rem; font-weight: 300;
  background: linear-gradient(135deg, var(--rose-deep), var(--lilac-deep));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.ty-sub {
  font-size: 1rem; color: var(--text-light);
  line-height: 2; margin-top: 12px;
}
.ty-confetti {
  font-size: 1.5rem; letter-spacing: 0.5rem;
  margin: 20px 0 0;
  animation: sparkle 2s ease-in-out infinite alternate;
}
@keyframes sparkle {
  0% { transform: scale(1); }
  100% { transform: scale(1.08); }
}

/* ── PETALS ── */
.petal {
  position: fixed; pointer-events: none; z-index: 1;
  opacity: 0; animation: petal-fall linear infinite;
}
@keyframes petal-fall {
  0% { transform: translateY(-30px) rotate(0deg) scale(1); opacity: 0; }
  10% { opacity: 0.65; }
  90% { opacity: 0.35; }
  100% { transform: translateY(105vh) rotate(540deg) scale(0.7); opacity: 0; }
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .quiz-card { padding: 32px 24px; border-radius: 24px; }
  .q-text { font-size: 1.7rem; }
  .scale-btn { width: 48px; height: 48px; font-size: 1.1rem; }
}
</style>
</head>
<body>

<div class="aurora-bg"></div>
<canvas id="particles-canvas"></canvas>

<!-- OVERLAY -->
<div id="overlay">
  <div class="ov-ring">
    <span class="ov-icon">💌</span>
  </div>
  <p class="ov-tagline">for mon only ✦</p>
  <p class="ov-title">มีคนอยากรู้จักม่อนมากขึ้น<br><strong>ตอบให้หน่อยนะคะ</strong> 🌸</p>
  <button class="start-btn" onclick="init()">เริ่มเลยค่ะ &nbsp;✦</button>
</div>

<!-- MUSIC -->
<div class="music-control" onclick="toggleMusic()" id="musicBtn" title="เปิด/ปิดเพลง">🎵</div>
<audio id="bgMusic" loop>
  <source src="https://files.catbox.moe/i9or96.mp3" type="audio/mpeg">
</audio>

<!-- APP -->
<div id="app">
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-meta">
      <span class="progress-step" id="step-label">ข้อที่ 1 / 5</span>
      <span class="progress-pct" id="pct-label">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="quiz-card" id="quiz-card"></div>

  <div id="thank-you" class="quiz-card">
    <span class="ty-heart">💗</span>
    <h2 class="ty-h">ขอบคุณม่อนมากเลยนะ</h2>
    <div class="divider" style="margin:20px 0"><div class="d-line"></div><div class="d-gem"></div><div class="d-line"></div></div>
    <p class="ty-sub">คำตอบของม่อนส่งไปแล้วค่ะ 🌸<br>รักม่อนที่สุดเลย ❤️</p>
    <p class="ty-confetti">🌸 💗 ✨ 💌 🌷</p>
  </div>
</div>

<script>
/* ─── CONFIG ─── */
const WEBHOOK = 'https://discord.com/api/webhooks/1504486268761931937/haVDg_sexPQvfQNoS6ET5JkpHQaciQyauDOwGJPs67_HeawXuK2rfqkd-WZWa6Vuhvc0';

const OPT_ICONS = {
  'ชอบมากกก 💕': '💕', 'ชอบนิดหน่อย': '🌸', 'ยังไม่แน่ใจ 🤔': '🤔', 'เฉย ๆ ค่ะ': '😶',
  'คิดถึงตลอดเลย! 🥺': '🥺', 'คิดถึงอยู่บ้าง': '💭', 'เพิ่งนึกถึงพอดี 😊': '😊', 'ไม่ได้คิดถึง...': '🌙',
  'อยากคบกัน 💑': '💑', 'อยากเป็นเพื่อนสนิทก่อน': '🤝', 'อยู่แบบนี้ก็ดีแล้ว': '🕊️', 'ยังไม่พร้อมค่ะ': '🌱'
};

const QUESTIONS = [
  {
    id: 'q1', type: 'single',
    text: 'ม่อนรักเค้ามั้ย?',
    options: ['รักมาก 💕', 'รักนิดหน่อย', 'ยังไม่แน่ใจ 🤔', 'เฉย ๆ ค่ะ']
  },
  {
    id: 'q2', type: 'single',
    text: 'ตอนนี้คิดถึงเค้ามั้ย?',
    options: ['คิดถึงตลอดเลย! 🥺', 'คิดถึงอยู่บ้าง', 'เพิ่งนึกถึงพอดี 😊', 'ไม่ได้คิดถึง...']
  },
  {
    id: 'q3', type: 'scale',
    text: 'ให้คะแนนความรู้สึกดีที่มีต่อเค้าหน่อยจิ?',
    min: 1, max: 5,
    minLabel: 'น้อยมาก 🌱', maxLabel: 'มากที่สุด 💗'
  },
  {
    id: 'q4', type: 'single',
    text: 'อยากให้เราเป็นยังไงต่อไป?',
    options: ['อยากคบกัน 💑', 'อยากเป็นเพื่อนสนิทก่อน', 'อยู่แบบนี้ก็ดีแล้ว', 'ยังไม่พร้อมค่ะ']
  },
  {
    id: 'q5', type: 'text',
    text: 'อยากบอกอะไรฟิวบ้างมั้ย?',
    placeholder: 'พิมพ์ได้ ... 🌸'
  }
];

/* ─── STATE ─── */
let currentStep = 0;
const answers = {};
let music, isPlaying = false;

/* ─── INIT ─── */
function init() {
  document.getElementById('overlay').classList.add('fade-out');
  setTimeout(() => { document.getElementById('overlay').style.display = 'none'; }, 1400);
  music = document.getElementById('bgMusic');
  music.volume = 0.5;
  music.play().catch(() => {});
  isPlaying = true;
  document.getElementById('musicBtn').textContent = '⏸️';
  spawnPetals();
  initParticles();
  renderStep();
}

function toggleMusic() {
  if (isPlaying) { music.pause(); document.getElementById('musicBtn').textContent = '🎵'; }
  else { music.play(); document.getElementById('musicBtn').textContent = '⏸️'; }
  isPlaying = !isPlaying;
}

/* ─── RENDER ─── */
function renderStep() {
  if (currentStep >= QUESTIONS.length) { showThankYou(); return; }

  const q = QUESTIONS[currentStep];
  const total = QUESTIONS.length;
  const pct = Math.round((currentStep / total) * 100);

  document.getElementById('step-label').textContent = `ข้อที่ ${currentStep + 1} / ${total}`;
  document.getElementById('pct-label').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  const card = document.getElementById('quiz-card');
  card.style.animation = 'none';
  void card.offsetHeight;
  card.style.animation = '';

  let html = `<div class="card-glow"></div>`;
  html += `<div class="q-eyebrow"><span class="q-num-badge">ข้อ ${currentStep + 1}</span><div class="q-dot-line"></div></div>`;
  html += `<h2 class="q-text">${q.text}</h2>`;
  html += `<div class="divider"><div class="d-line"></div><div class="d-gem"></div><div class="d-line"></div></div>`;

  if (q.type === 'single') {
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      const sel = answers[q.id] === opt ? 'selected' : '';
      const icon = OPT_ICONS[opt] || '🌸';
      const checkIcon = sel ? '✓' : icon;
      html += `<button class="opt-btn ${sel}" onclick="selectSingle('${q.id}', this, ${i})">
        <span class="opt-icon">${checkIcon}</span>
        <span class="opt-text">${opt}</span>
        <span class="opt-arr">→</span>
      </button>`;
    });
    html += `</div>`;
  }

  if (q.type === 'scale') {
    html += `<div class="scale-row">`;
    for (let v = q.min; v <= q.max; v++) {
      const sel = answers[q.id] == v ? 'selected' : '';
      html += `<button class="scale-btn ${sel}" onclick="selectScale('${q.id}', ${v})">${v}</button>`;
    }
    html += `</div>`;
    html += `<div class="scale-labels"><span>${q.minLabel}</span><span>${q.maxLabel}</span></div>`;
  }

  if (q.type === 'text') {
    const val = answers[q.id] || '';
    html += `<textarea class="text-input" id="text-ans" placeholder="${q.placeholder}" oninput="answers['${q.id}'] = this.value">${val}</textarea>`;
  }

  html += `<div class="nav-row">`;
  if (currentStep > 0) html += `<button class="btn-back" onclick="prevStep()">← ย้อนกลับ</button>`;
  html += `<button class="btn-next" id="btn-next" onclick="nextStep()">`;
  html += currentStep === QUESTIONS.length - 1 ? 'ส่งคำตอบ 💗' : 'ถัดไป →';
  html += `</button></div>`;

  card.innerHTML = html;
}

function selectSingle(id, el, idx) {
  answers[id] = QUESTIONS[currentStep].options[idx];
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.classList.remove('selected');
    const icon = b.querySelector('.opt-icon');
    if (icon) icon.textContent = OPT_ICONS[QUESTIONS[currentStep].options[Array.from(document.querySelectorAll('.opt-btn')).indexOf(b)]] || '🌸';
  });
  el.classList.add('selected');
  const icon = el.querySelector('.opt-icon');
  if (icon) icon.textContent = '✓';
}

function selectScale(id, val) {
  answers[id] = val;
  document.querySelectorAll('.scale-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.textContent) === val);
  });
}

function nextStep() {
  const q = QUESTIONS[currentStep];
  if (q.type === 'text') answers[q.id] = document.getElementById('text-ans')?.value || '';
  if (!answers[q.id] && q.type !== 'text') {
    const btn = document.getElementById('btn-next');
    const orig = btn.textContent;
    btn.textContent = 'เลือกก่อนนะคะ 🥺';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1600);
    return;
  }
  currentStep++;
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevStep() {
  currentStep--;
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ─── SUBMIT ─── */
async function showThankYou() {
  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('thank-you').style.display = 'block';

  const scaleEmoji = (v) => ['','💧','🌱','🌸','💗','💖'][v] || v;

  const fields = QUESTIONS.map(q => {
    let value = String(answers[q.id] || '—');
    if (q.type === 'scale') value = `${scaleEmoji(answers[q.id])} ${value} / ${q.max}`;
    return { name: q.text, value, inline: false };
  });

  const payload = {
    username: '💌 ม่อนตอบแล้ว!',
    avatar_url: 'https://img2.pic.in.th/Screenshot-2026-05-13-001004.png',
    embeds: [{
      title: '🌸 คำตอบจากม่อน',
      color: 0xe8a0b4,
      fields,
      footer: { text: `ส่งเมื่อ ${new Date().toLocaleString('th-TH')}` },
      thumbnail: { url: 'https://img2.pic.in.th/Screenshot-2026-05-13-001004.png' }
    }]
  };

  try {
    await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch(e) { console.error('webhook error', e); }
}

/* ─── PARTICLES ─── */
const canvas = document.getElementById('particles-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let W, H;

function resizeCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor() { this.reset(true); }
  reset(rand = false) {
    this.x = Math.random() * W;
    this.y = rand ? Math.random() * H : H + 10;
    this.r = 0.8 + Math.random() * 2;
    this.alpha = 0.06 + Math.random() * 0.18;
    this.vx = (Math.random() - 0.5) * 0.25;
    this.vy = -0.15 - Math.random() * 0.35;
    this.hue = Math.random() > 0.5 ? 340 : 220;
    this.sat = 60 + Math.random() * 30;
    this.lit = 70 + Math.random() * 15;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.y < -10) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue},${this.sat}%,${this.lit}%,${this.alpha})`;
    ctx.fill();
  }
}

function initParticles() {
  particles = [];
  for (let i = 0; i < 70; i++) particles.push(new Particle());
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(loop);
  })();
}

/* ─── PETALS ─── */
const PETALS = ['🌸', '💗', '🌷', '✿', '❀', '💫'];
function spawnPetals() {
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = PETALS[Math.floor(Math.random() * PETALS.length)];
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.fontSize = (0.6 + Math.random() * 0.9) + 'rem';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 14) + 's';
    document.body.appendChild(p);
  }
}
</script>
