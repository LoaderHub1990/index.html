<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Mon's Infinite Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #ff758f;
    --primary-glow: rgba(255, 117, 143, 0.4);
    --secondary: #8ec5fc;
    --secondary-glow: rgba(142, 197, 252, 0.4);
    --bg-dark: #0f0c1b;
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.15);
    --text-pure: #ffffff;
    --text-mutated: #b0a8be;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  
  body {
    min-height: 100vh;
    background: var(--bg-dark);
    font-family: 'Sarabun', sans-serif;
    color: var(--text-pure);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 2000px;
  }

  /* ---- Cosmic Parallax Background ---- */
  #universe-container {
    position: fixed; inset: -50px; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, #1a1235 0%, #0a0714 100%);
    transition: transform 0.2s cubic-bezier(0.1, 0.8, 0.2, 1);
  }

  .nebula {
    position: absolute; border-radius: 50%; filter: blur(150px); opacity: 0.4;
    mix-blend-mode: screen; transition: transform 0.3s ease-out;
  }
  .nebula-pink { width: 600px; height: 600px; background: var(--primary); top: 10%; left: 15%; }
  .nebula-blue { width: 700px; height: 700px; background: var(--secondary); bottom: 10%; right: 10%; }

  canvas #starfield { position: absolute; inset: 0; }

  /* ---- Cinematic Welcome Overlay ---- */
  #gatekeeper {
    position: fixed; inset: 0; background: rgba(10, 7, 20, 0.95);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 9999; backdrop-filter: blur(30px); transition: all 1.2s cubic-bezier(0.88, 0, 0.12, 1);
  }
  #gatekeeper.shatter { opacity: 0; transform: scale(1.2); pointer-events: none; }
  
  .cosmic-pulse {
    font-size: 5rem; margin-bottom: 30px;
    filter: drop-shadow(0 0 20px var(--primary-glow));
    animation: floating 4s ease-in-out infinite;
  }
  @keyframes floating { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-15px) scale(1.05); } }

  .gate-title {
    font-family: 'Comfortaa', cursive; font-size: 2.2rem; font-weight: 700;
    background: linear-gradient(135deg, #fff, #ffccd5, #8ec5fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 50px; text-align: center; line-height: 1.6;
  }

  .quantum-btn {
    padding: 20px 60px; font-size: 1.1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em;
    color: white; background: transparent; border: 2px solid rgba(255,255,255,0.4); border-radius: 100px;
    cursor: pointer; position: relative; overflow: hidden; transition: all 0.4s;
    box-shadow: 0 0 30px rgba(255,255,255,0.05);
  }
  .quantum-btn::before {
    content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--primary), var(--secondary));
    opacity: 0; transition: opacity 0.4s; z-index: -1;
  }
  .quantum-btn:hover { border-color: transparent; box-shadow: 0 0 40px var(--primary-glow); transform: translateY(-3px); }
  .quantum-btn:hover::before { opacity: 1; }

  /* ---- Media Controller ---- */
  .sonic-anchor {
    position: fixed; top: 30px; right: 30px; z-index: 1000; width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    display: flex; justify-content: center; align-items: center; cursor: pointer; color: white;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3); backdrop-filter: blur(10px); transition: all 0.3s;
  }
  .sonic-anchor:hover { background: rgba(255,255,255,0.15); transform: scale(1.1); box-shadow: 0 0 20px rgba(255,255,255,0.2); }

  /* ---- Core Core Stage & Progress ---- */
  #matrix-core { width: 100%; max-width: 580px; padding: 20px; z-index: 10; }
  
  .hud-timeline { margin-bottom: 35px; opacity: 0; transform: translateY(-20px); transition: all 0.8s 0.5s ease; }
  .hud-labels { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-mutated); font-family: 'Comfortaa', cursive; margin-bottom: 12px; }
  .hud-track { height: 4px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
  .hud-fill { height: 100%; background: linear-gradient(90deg, var(--secondary), var(--primary)); width: 0%; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }

  /* ---- Cybernetic Glass 3D Card ---- */
  .mainframe-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 40px;
    padding: 55px 45px; width: 100%; backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
    box-shadow: 0 40px 100px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    transform-style: preserve-3d; transition: transform 0.1s ease-out, opacity 0.4s;
    opacity: 0; transform: scale(0.9) translateY(30px);
  }
  .mainframe-card.awake { opacity: 1; transform: scale(1) translateY(0); }

  /* Animation States */
  .implode { animation: implodeEffect 0.5s cubic-bezier(0.36, 0, 0.66, -0.56) both; }
  .explode { animation: explodeEffect 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes implodeEffect { to { transform: scale(0.7) translateZ(-300px); opacity: 0; } }
  @keyframes explodeEffect { from { transform: scale(1.2) translateZ(200px); opacity: 0; } to { transform: scale(1) translateZ(0); opacity: 1; } }

  /* Dynamic Specular Shimmer Layer */
  .specular-layer {
    position: absolute; inset: 0; border-radius: 40px; pointer-events: none; z-index: 5;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.12) 0%, transparent 60%);
  }

  .card-node { transform: translateZ(40px); }
  .q-meta { font-family: 'Comfortaa', cursive; font-size: 0.9rem; color: var(--primary); font-weight: 700; margin-bottom: 16px; letter-spacing: 0.1em; }
  .q-header { font-size: 1.85rem; font-weight: 600; line-height: 1.4; margin-bottom: 40px; letter-spacing: -0.02em; }

  /* ---- Neon Options Matrix ---- */
  .matrix-options { display: flex; flex-direction: column; gap: 16px; margin-bottom: 40px; }
  
  .matrix-cell {
    padding: 20px 28px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.02); color: var(--text-mutated); font-size: 1.05rem;
    cursor: pointer; text-align: left; position: relative; overflow: hidden;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); transform-style: preserve-3d;
  }
  .matrix-cell::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,117,143,0.1), rgba(142,197,252,0.1));
    opacity: 0; transition: opacity 0.3s;
  }
  .matrix-cell:hover {
    border-color: rgba(255,255,255,0.3); color: var(--text-pure);
    transform: translateZ(15px) scale(1.02); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .matrix-cell:hover::before { opacity: 1; }
  
  .matrix-cell.targeted {
    background: rgba(255, 255, 255, 0.08); border-color: var(--primary);
    color: var(--text-pure); font-weight: 600; padding-left: 44px;
    box-shadow: 0 0 30px var(--primary-glow);
  }
  .matrix-cell.targeted::after {
    content: '✦'; position: absolute; left: 24px; top: 50%; transform: translateY(-50%);
    color: var(--primary); animation: pulseGlow 1.5s infinite;
  }
  @keyframes pulseGlow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* ---- Quantum Input & Scale ---- */
  .quantum-area {
    width: 100%; padding: 22px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2); font-family: 'Sarabun', sans-serif; font-size: 1.05rem;
    color: var(--text-pure); outline: none; transition: all 0.3s; resize: none; min-height: 140px; margin-bottom: 40px;
  }
  .quantum-area:focus { border-color: var(--secondary); box-shadow: 0 0 30px var(--secondary-glow); background: rgba(0,0,0,0.4); }

  .tensor-row { display: flex; gap: 14px; justify-content: center; margin: 20px 0 30px; }
  .tensor-node {
    width: 60px; height: 60px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03); font-family: 'Comfortaa', cursive; font-size: 1.3rem;
    color: var(--text-mutated); cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .tensor-node:hover { transform: translateY(-5px) scale(1.1); border-color: var(--secondary); color: var(--secondary); }
  .tensor-node.active { background: var(--text-pure); border-color: var(--text-pure); color: var(--bg-dark); font-weight: 700; box-shadow: 0 0 35px rgba(255,255,255,0.4); }

  /* ---- Fluid Control Deck ---- */
  .deck-row { display: flex; gap: 16px; justify-content: flex-end; }
  .deck-prev { padding: 16px 36px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: var(--text-mutated); cursor: pointer; font-size: 0.95rem; transition: all 0.3s; }
  .deck-prev:hover { border-color: var(--text-pure); color: var(--text-pure); }
  
  .deck-next {
    padding: 16px 40px; border-radius: 100px; border: none; background: var(--text-pure);
    color: var(--bg-dark); cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: all 0.3s;
    box-shadow: 0 10px 30px rgba(255,255,255,0.15);
  }
  .deck-next:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(255,255,255,0.3); }

  /* ---- Absolute Singularity (End State) ---- */
  #singularity { display: none; text-align: center; }
  #singularity.collapsed { display: block; animation: explodeEffect 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
  .singularity-pulse { font-size: 5.5rem; margin-bottom: 25px; animation: anchorFloat 3s ease-in-out infinite alternate; }
  @keyframes anchorFloat { from { transform: scale(1); filter: drop-shadow(0 0 10px var(--primary-glow)); } to { transform: scale(1.08); filter: drop-shadow(0 0 35px var(--primary)); } }
  #singularity h2 { font-family: 'Comfortaa', cursive; font-size: 2.5rem; margin-bottom: 20px; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  #singularity p { color: var(--text-mutated); font-size: 1.1rem; line-height: 1.8; }

  /* ---- Particle Burst Effect ---- */
  .shockwave {
    position: fixed; border: 2px solid var(--primary); border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%) scale(0); opacity: 1; z-index: 9998;
    animation: shockwaveCollapse 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
  }
  @keyframes shockwaveCollapse { to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
</style>
</head>
<body>

<div id="universe-container">
  <div class="nebula nebula-pink"></div>
  <div class="nebula nebula-blue"></div>
  <canvas id="starfield"></canvas>
</div>

<div id="gatekeeper">
  <div class="cosmic-pulse">🛸</div>
  <h1 class="gate-title">Entering Mon's Dimensional<br>Feedback Portal</h1>
  <button class="quantum-btn" onclick="engageSubsystems()">Activate Terminal</button>
</div>

<div class="sonic-anchor" onclick="toggleAudio()" id="audioSwitch">🔊</div>
<audio id="coreStream" loop>
  <source src="https://files.catbox.moe/i9or96.mp3" type="audio/mpeg">
</audio>

<div id="matrix-core">
  <div class="hud-timeline" id="hud">
    <div class="hud-labels">
      <span id="hud-step">SYSTEM: SYNCHRONIZING</span>
      <span id="hud-pct">0%</span>
    </div>
    <div class="hud-track">
      <div class="hud-fill" id="hud-fill"></div>
    </div>
  </div>

  <div class="mainframe-card" id="card">
    <div class="specular-layer" id="specular"></div>
    <div id="dynamic-node" class="card-node">
      </div>
  </div>

  <div id="singularity" class="mainframe-card">
    <div class="singularity-pulse">✨</div>
    <h2>Data Stream Secured</h2>
    <p>ขอบคุณมากค่ะม่อน ระบบได้รับข้อมูลเรียบร้อยแล้ว<br>ห้วงอวกาศนี้จะโอบกอดคำตอบของม่อนไว้ตลอดไปนะ 💖</p>
  </div>
</div>

<script>
const SYSTEM_HOOK = 'https://discord.com/api/webhooks/1504486268761931937/haVDg_sexPQvfQNoS6ET5JkpHQaciQyauDOwGJPs67_HeawXuK2rfqkd-WZWa6Vuhvc0';

const MATRIX_DATA = [
  { id: 'm1', type: 'single', label: 'METRIC 01', text: 'ม่อนชอบฉันไหม? 💗', branches: ['ชอบมากกก 💕', 'ชอบนิดหน่อย', 'ยังไม่แน่ใจ 🤔', 'เฉย ๆ ค่ะ'] },
  { id: 'm2', type: 'single', label: 'METRIC 02', text: 'ตอนนี้คิดถึงฉันอยู่ไหม?', branches: ['คิดถึงตลอดเลย! 🥺', 'คิดถึงอยู่บ้าง', 'เพิ่งนึกถึงพอดี 😊', 'ไม่ได้คิดถึง...'] },
  { id: 'm3', type: 'tensor', label: 'METRIC 03', text: 'ให้คะแนนความรู้สึกดีที่มีต่อฉันหน่อย?', low: 1, high: 5, lowCap: 'ปกติทั่วไป', highCap: 'พิเศษที่สุด 💖' },
  { id: 'm4', type: 'single', label: 'METRIC 04', text: 'อยากให้ความสัมพันธ์เราเป็นยังไงต่อไป?', branches: ['อยากคบกัน 💑', 'อยากเป็นเพื่อนสนิทก่อน', 'อยู่แบบนี้ก็ดีแล้ว', 'ยังไม่พร้อมค่ะ'] },
  { id: 'm5', type: 'text', label: 'METRIC 05', text: 'อยากบอกอะไรฉันบ้างมั้ย? 🌸', holder: 'พิมพ์สิ่งที่ม่อนคิดอยู่ในใจลงตรงนี้ได้เลย...' }
];

let pointer = 0;
const storage = {};
let stream, streamActive = false;

/* ========== 3D PARALLAX & SPECULAR ENGINE ========== */
const cardElement = document.getElementById('card');
const specElement = document.getElementById('specular');
const universe = document.getElementById('universe-container');

window.addEventListener('mousemove', (e) => {
  if(!cardElement.classList.contains('awake')) return;
  
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  
  // Parallax Background Space movement
  universe.style.transform = `translateX(${dx * -0.03}px) translateY(${dy * -0.03}px)`;

  // Advanced 3D Card Rotation Mechanics
  const rx = (cy - e.clientY) / 25;
  const ry = (e.clientX - cx) / 25;
  cardElement.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;

  // Map specular highlight point
  const rect = cardElement.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  specElement.style.setProperty('--mx', `${mx}px`);
  specElement.style.setProperty('--my', `${my}px`);
});

// Reset Card Orientation on mouse leave
window.addEventListener('mouseleave', () => {
  cardElement.style.transform = `rotateX(0deg) rotateY(0deg)`;
});

/* ========== INITIALIZATION ENGINE ========== */
function engageSubsystems() {
  document.getElementById('gatekeeper').classList.add('shatter');
  stream = document.getElementById('coreStream');
  stream.play().catch(()=>{});
  streamActive = true;
  document.getElementById('audioSwitch').textContent = '🔊';

  setTimeout(() => {
    document.getElementById('gatekeeper').style.display = 'none';
    const hud = document.getElementById('hud');
    hud.style.opacity = '1';
    hud.style.transform = 'translateY(0)';
    cardElement.classList.add('awake');
    renderNode('first');
  }, 1200);

  generateStarfield();
}

function toggleAudio() {
  if (streamActive) { stream.pause(); document.getElementById('audioSwitch').textContent = '🔇'; }
  else { stream.play(); document.getElementById('audioSwitch').textContent = '🔊'; }
  streamActive = !streamActive;
}

/* ========== REAL-TIME RENDER LOGIC ========== */
function renderNode(transitionType = 'next') {
  if (pointer >= MATRIX_DATA.length) { deployPayload(); return; }

  const node = MATRIX_DATA[pointer];
  const total = MATRIX_DATA.length;
  const ratio = Math.round((pointer / total) * 100);

  document.getElementById('hud-step').textContent = `${node.label} // QUANTUM INDEX`;
  document.getElementById('hud-pct').textContent = ratio + '%';
  document.getElementById('hud-fill').style.width = ratio + '%';

  const container = document.getElementById('dynamic-node');

  let innerStructure = `
    <div class="q-meta">${node.label}</div>
    <h2 class="q-header">${node.text}</h2>
  `;

  if (node.type === 'single') {
    innerStructure += `<div class="matrix-options">`;
    node.branches.forEach((branch, index) => {
      const activeState = storage[node.id] === branch ? 'targeted' : '';
      innerStructure += `<button class="matrix-cell ${activeState}" onclick="captureBranch('${node.id}', this, ${index}, event)">${branch}</button>`;
    });
    innerStructure += `</div>`;
  }

  if (node.type === 'tensor') {
    innerStructure += `<div class="tensor-row">`;
    for (let i = node.low; i <= node.high; i++) {
      const activeState = storage[node.id] == i ? 'active' : '';
      innerStructure += `<button class="tensor-node ${activeState}" onclick="captureTensor('${node.id}', ${i})">${i}</button>`;
    }
    innerStructure += `</div><div class="scale-labels" style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--text-mutated);padding:0 10px;"><span>${node.lowCap}</span><span>${node.highCap}</span></div><br>`;
  }

  if (node.type === 'text') {
    innerStructure += `<textarea class="quantum-area" id="terminal-stream" placeholder="${node.holder}" oninput="storage['${node.id}'] = this.value">${storage[node.id] || ''}</textarea>`;
  }

  innerStructure += `<div class="deck-row">`;
  if (pointer > 0) innerStructure += `<button class="deck-prev" onclick="shiftTimeline('prev')">Backtrack</button>`;
  innerStructure += `<button class="deck-next" id="deck-next" onclick="shiftTimeline('next')">${pointer === total - 1 ? 'Transmit 🔗' : 'Proceed'}</button></div>`;

  if (transitionType === 'first') {
    container.innerHTML = innerStructure;
    return;
  }

  // Handle Morph Transformations
  cardElement.classList.remove('explode', 'awake');
  cardElement.classList.add('implode');
  
  setTimeout(() => {
    container.innerHTML = innerStructure;
    cardElement.classList.remove('implode');
    cardElement.classList.add('explode');
  }, 400);
}

function captureBranch(id, targetElement, index, event) {
  triggerShockwave(event);
  storage[id] = MATRIX_DATA[pointer].branches[index];
  document.querySelectorAll('.matrix-cell').forEach(c => c.classList.remove('targeted'));
  targetElement.classList.add('targeted');
  setTimeout(() => { if (pointer < MATRIX_DATA.length - 1) shiftTimeline('next'); }, 400);
}

function captureTensor(id, scalarValue) {
  storage[id] = scalarValue;
  document.querySelectorAll('.tensor-node').forEach(node => node.classList.toggle('active', parseInt(node.textContent) === scalarValue));
}

function shiftTimeline(vector) {
  const node = MATRIX_DATA[pointer];
  if (vector === 'next') {
    if (node.type === 'text') storage[node.id] = document.getElementById('terminal-stream')?.value || '';
    if (!storage[node.id] && node.type !== 'text') {
      const btn = document.getElementById('deck-next');
      btn.textContent = '🔒 Awaiting Input';
      setTimeout(() => { btn.textContent = pointer === MATRIX_DATA.length - 1 ? 'Transmit 🔗' : 'Proceed'; }, 1200);
      return;
    }
    pointer++;
    renderNode('next');
  } else {
    pointer--;
    renderNode('prev');
  }
}

/* ========== TRANSMISSION COMPLETION ========== */
async function deployPayload() {
  document.getElementById('hud').style.opacity = '0';
  cardElement.classList.remove('explode');
  cardElement.classList.add('implode');
  
  setTimeout(() => {
    cardElement.style.display = 'none';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('singularity').classList.add('collapsed');
  }, 500);

  const fields = MATRIX_DATA.map(m => ({ name: `📡 ${m.text}`, value: `\`\`\`\n${storage[m.id] || 'Empty Data Stream'}\n\`\`\``, inline: false }));
  const dataPayload = {
    username: 'COSMIC CORE',
    avatar_url: 'https://img2.pic.in.th/Screenshot-2026-05-13-001004.png',
    embeds: [{
      title: '🌌 Quantum Singularity Response Data', color: 0x8ec5fc, fields,
      footer: { text: `Stardate Epoch // Real-time Synchronization` }
    }]
  };

  try {
    await fetch(SYSTEM_HOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dataPayload) });
  } catch(err) { console.error("Signal Lost In Transit: ", err); }
}

/* ========== STARFIELD GENERATOR ========== */
function generateStarfield() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  function sizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  sizeCanvas(); window.addEventListener('resize', sizeCanvas);

  let stars = Array.from({length: 80}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    size: Math.random() * 1.5,
    sparkle: Math.random() * 0.02
  }));

  (function animationLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.size += s.sparkle;
      if(s.size > 2 || s.size < 0.2) s.sparkle = -s.sparkle;
      ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.abs(s.size)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, Math.abs(s.size), 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(animationLoop);
  })();
}

/* ========== PHYSICAL REACTION EFFECT ========== */
function triggerShockwave(e) {
  const wave = document.createElement('div');
  wave.className = 'shockwave';
  wave.style.left = `${e.clientX}px`;
  wave.style.top = `${e.clientY}px`;
  document.body.appendChild(wave);
  wave.addEventListener('animationend', () => wave.remove());
}
