<script>
const form = document.getElementById('mainForm');

form.addEventListener('submit', function(e) {
    e.preventDefault();

    const input = document.getElementById('linkInput').value.trim();

    if (!input) {
        alert("กรุณาใส่ลิงก์");
        return;
    }

    // ตรวจว่าเป็นลิงก์ TrueMoney ไหม
    if (!input.includes("gift.truemoney.com")) {
        alert("กรุณาใส่ลิงก์ซองอั่งเปา TrueMoney");
        return;
    }

    // สร้างลิงก์ป้องกัน
    const encoded = btoa(input);

    const protectedLink =
        window.location.origin +
        window.location.pathname +
        "?open=" +
        encoded;

    // แสดงผล
    showResult(protectedLink);
});

// แสดงกล่องลิงก์
function showResult(link) {

    let oldBox = document.getElementById("resultBox");
    if (oldBox) oldBox.remove();

    const box = document.createElement("div");

    box.id = "resultBox";

    box.innerHTML = `
        <div class="glass-card p-4 mt-3 fade-in">
            <div class="alert-success-custom mb-3">
                <i class="bi bi-check-circle-fill"></i>
                สร้างลิงก์สำเร็จ
            </div>

            <div class="copy-group">
                <input type="text" value="${link}" id="resultInput" readonly>
                <button onclick="copyLink()">
                    <i class="bi bi-copy"></i>
                </button>
            </div>
        </div>
    `;

    document.querySelector('.main-content').appendChild(box);
}

// คัดลอก
function copyLink() {
    const input = document.getElementById("resultInput");

    input.select();
    input.setSelectionRange(0, 99999);

    navigator.clipboard.writeText(input.value);

    alert("คัดลอกลิงก์แล้ว");
}

// เปิดลิงก์อัตโนมัติ
window.addEventListener("DOMContentLoaded", () => {

    const params = new URLSearchParams(window.location.search);

    const open = params.get("open");

    if (open) {

        try {

            const decoded = atob(open);

            document.body.innerHTML = `
                <div style="
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    font-family:sans-serif;
                    flex-direction:column;
                    gap:20px;
                ">
                    <h2>กำลังตรวจสอบ...</h2>

                    <button id="goBtn" disabled style="
                        padding:12px 24px;
                        border:none;
                        border-radius:12px;
                        background:#0ea5e9;
                        color:white;
                        font-size:16px;
                    ">
                        กรุณารอ 5 วินาที...
                    </button>
                </div>
            `;

            const btn = document.getElementById("goBtn");

            let sec = 5;

            const timer = setInterval(() => {

                sec--;

                btn.innerText = `กรุณารอ ${sec} วินาที...`;

                if (sec <= 0) {

                    clearInterval(timer);

                    btn.disabled = false;

                    btn.innerText = "เปิดซองอั่งเปา";

                    btn.onclick = () => {
                        location.href = decoded;
                    };
                }

            }, 1000);

        } catch(err) {
            alert("ลิงก์ไม่ถูกต้อง");
        }
    }
});
</script>
