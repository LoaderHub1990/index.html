<!DOCTYPE html>
<html lang="th" data-theme="light">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flash Anti Link</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

:root{
    --primary:#0ea5e9;
    --bg:#f0f9ff;
    --card:#fff;
    --text:#1e293b;
    --border:#e2e8f0;
}

[data-theme="dark"]{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f1f5f9;
    --border:rgba(255,255,255,.1);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Sarabun',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

.navbar{
    height:60px;
    display:flex;
    align-items:center;
    border-bottom:1px solid var(--border);
    background:rgba(255,255,255,.8);
    backdrop-filter:blur(10px);
}

.main{
    padding:40px 16px;
    display:flex;
    justify-content:center;
}

.card-box{
    width:100%;
    max-width:500px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:28px;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.logo{
    width:72px;
    border-radius:18px;
    animation:float 3s infinite ease-in-out;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

.title{
    font-weight:800;
    margin-top:14px;
    margin-bottom:6px;
    font-size:26px;
    background:linear-gradient(135deg,#0284c7,#2563eb);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.desc{
    color:gray;
    font-size:14px;
}

.form-control{
    border-radius:14px;
    padding:14px;
}

.btn-main{
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    font-weight:700;
    color:white;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
    transition:.2s;
}

.btn-main:hover{
    transform:translateY(-2px);
}

.result-box{
    margin-top:20px;
    display:none;
}

.copy-box{
    display:flex;
    gap:10px;
}

.copy-box input{
    flex:1;
    border:none;
    outline:none;
    padding:12px;
    border-radius:12px;
    background:#f1f5f9;
}

.copy-btn{
    border:none;
    padding:12px 18px;
    border-radius:12px;
    background:#0ea5e9;
    color:white;
    font-weight:700;
}

.theme-btn{
    width:38px;
    height:38px;
    border:none;
    border-radius:10px;
    background:#e2e8f0;
}

.footer{
    text-align:center;
    padding:20px;
    color:gray;
    font-size:13px;
}

</style>
</head>

<body>

<nav class="navbar">
<div class="container d-flex justify-content-between align-items-center">

<div class="fw-bold">
Flash<span style="color:#0ea5e9;">.</span>Anti
</div>

<button class="theme-btn" onclick="toggleTheme()">
<i id="themeIcon" class="bi bi-moon-stars"></i>
</button>

</div>
</nav>

<div class="main">

<div class="card-box text-center">

<img
class="logo"
src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png"
onerror="this.src='https://via.placeholder.com/72';"
>

<div class="title">
FLASH ANTI LINK
</div>

<div class="desc mb-4">
รองรับทุกลิงก์ ไม่มี 404
</div>

<form id="mainForm">

<input
type="url"
id="linkInput"
class="form-control mb-3"
placeholder="https://example.com/..."
required
>

<button type="submit" class="btn-main" id="submitBtn">
<i class="bi bi-shield-lock-fill me-2"></i>
สร้างลิงก์
</button>

</form>

<div class="result-box" id="resultBox">

<label class="fw-bold mb-2 d-block text-start">
ลิงก์ที่สร้างแล้ว
</label>

<div class="copy-box">

<input type="text" id="resultInput" readonly>

<button
type="button"
class="copy-btn"
onclick="copyLink()"
>
COPY
</button>

</div>

</div>

</div>

</div>

<div class="footer">
Flash Anti Link © 2026
</div>

<script>

const savedTheme =
localStorage.getItem("theme") || "light";

document.documentElement.setAttribute(
"data-theme",
savedTheme
);

updateThemeIcon(savedTheme);

function toggleTheme(){

    const current =
    document.documentElement.getAttribute("data-theme");

    const next =
    current === "light"
    ? "dark"
    : "light";

    document.documentElement.setAttribute(
    "data-theme",
    next
    );

    localStorage.setItem("theme", next);

    updateThemeIcon(next);
}

function updateThemeIcon(theme){

    const icon =
    document.getElementById("themeIcon");

    icon.className =
    theme === "dark"
    ? "bi bi-sun"
    : "bi bi-moon-stars";
}

document
.getElementById("mainForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const input =
    document.getElementById("linkInput")
    .value
    .trim();

    try{
        new URL(input);
    }catch{
        alert("ลิงก์ไม่ถูกต้อง");
        return;
    }

    const btn =
    document.getElementById("submitBtn");

    btn.disabled = true;

    btn.innerHTML =
    '<i class="bi bi-arrow-repeat me-2"></i>กำลังสร้าง...';

    setTimeout(()=>{

        const fakeLink =
        window.location.origin +
        "/?url=" +
        encodeURIComponent(input);

        document.getElementById("resultInput").value =
        fakeLink;

        document.getElementById("resultBox").style.display =
        "block";

        btn.disabled = false;

        btn.innerHTML =
        '<i class="bi bi-shield-lock-fill me-2"></i>สร้างลิงก์';

    },1000);

});

function copyLink(){

    const input =
    document.getElementById("resultInput");

    input.select();

    navigator.clipboard.writeText(input.value);

    alert("คัดลอกลิงก์แล้ว");

}

</script>

</body>
</html>
