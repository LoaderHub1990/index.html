<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Love ม่อน</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-light: #ffd1dc;
    --blue-light: #b3e5fc;
    --white: #ffffff;
    --text-pink: #ff85a2;
    --text-blue: #64b5f6;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--pink-light) 0%, var(--white) 50%, var(--blue-light) 100%);
    background-attachment: fixed; /* พื้นหลังนิ่งเวลาเลื่อนดูรูป */
    font-family: 'Sarabun', sans-serif;
    color: #555;
  }

  /* หน้ากากกดเข้า */
  #overlay {
    position: fixed; inset: 0;
    background: white;
    display: flex; justify-content: center; align-items: center;
    z-index: 9999; transition: 0.8s ease;
  }
  .start-btn {
    padding: 15px 40px; font-size: 1.1rem;
    background: var(--text-pink); color: white;
    border: none; border-radius: 30px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(255,133,162,0.3);
  }

  /* ปุ่มควบคุมเพลง */
  .music-control {
    position: fixed; top: 20px; right: 20px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.8);
    width: 45px; height: 45px;
    border-radius: 50%; display: flex;
    justify-content: center; align-items: center;
    cursor: pointer; border: 2px solid var(--text-pink);
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }

  .container {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 20px; /* เพิ่ม padding บนล่างให้เลื่อนดูง่าย */
  }

  .love-card {
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(15px);
    border-radius: 30px; padding: 30px;
    max-width: 600px; width: 100%;
    text-align: center; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.05);
    border: 1px solid rgba(255,255,255,0.8);
  }

  /* จัดการรูปภาพขนาดใหญ่แนวนอน */
  .photo-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 25px;
  }
  .large-img {
    width: 100%;
    height: auto;
    border-radius: 15px;
    border: 5px solid white;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
  }

  .nav-btn {
    margin-top: 25px; padding: 12px 35px;
    background: white; color: var(--text-pink);
    border: 2px solid var(--text-pink);
    border-radius: 30px; cursor: pointer;
    font-weight: 600; transition: 0.3s;
  }
  .nav-btn:hover { background: var(--text-pink); color: white; }

  .hidden { display: none; }

  .main-img-circle {
    width: 180px; height: 180px; border-radius: 50%;
    margin-bottom: 20px; border: 6px solid white;
    object-fit: cover;
    animation: float 4s ease-in-out infinite;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
</style>
</head>
<body>

<div id="overlay">
  <button class="start-btn" onclick="init()">กดสิ >< </button>
</div>

<div class="music-control" onclick="toggleMusic()" id="musicBtn">🎵</div>

<audio id="bgMusic" loop>
  <source src="https://files.catbox.moe/i9or96.mp3" type="audio/mpeg">
</audio>

<div class="container" id="page-1">
  <div class="love-card">
    <img src="https://img2.pic.in.th/Screenshot-2026-05-13-001004.png" class="main-img-circle">
    <h1 style="color:var(--text-pink); font-family: 'Playfair Display', serif; font-size: 2.5rem;">Our Memories</h1>
    <p style="margin: 15px 0; color: #777;">คิดถึงม่อนนนนนนนนนนน</p>
    <button class="nav-btn" onclick="goToPage(2)">อยากรู้ก็กดสิคะ😆 ➔</button>
  </div>
</div>

<div class="container hidden" id="page-2">
  <div class="love-card">
    <h2 style="color:var(--text-blue); margin-bottom: 10px; font-family: 'Playfair Display', serif;">ก็ลองดู่วววว</h2>
    <p style="font-size: 0.9rem; color: #999; margin-bottom: 20px;">(เลื่อนลงเพื่อดูรูปทั้งหมด)</p>
    
    <div class="photo-list">
      <img src="https://img2.pic.in.th/Screenshot-2026-05-13-001004.png" class="large-img">
      <img src="https://img2.pic.in.th/Screenshot-2026-05-13-001144.png" class="large-img">
      <img src="https://img1.pic.in.th/images/Screenshot-2026-05-13-002149.png" class="large-img">
    </div>

    <button class="nav-btn" onclick="goToPage(1)" style="border-color: #ccc; color: #999; margin-top: 40px;">ย้อนกลับไปหน้าแรก</button>
  </div>
</div>

<script>
const music = document.getElementById('bgMusic');
let isPlaying = false;

function init() {
  document.getElementById('overlay').style.opacity = '0';
  setTimeout(() => document.getElementById('overlay').style.display = 'none', 800);
  music.play();
  isPlaying = true;
  document.getElementById('musicBtn').textContent = '⏸️';
}

function toggleMusic() {
  if (isPlaying) {
    music.pause();
    document.getElementById('musicBtn').textContent = '▶️';
  } else {
    music.play();
    document.getElementById('musicBtn').textContent = '⏸️';
  }
  isPlaying = !isPlaying;
}

function goToPage(page) {
  // เลื่อนหน้าจอขึ้นไปด้านบนสุดก่อนเปลี่ยนหน้า
  window.scrollTo({top: 0, behavior: 'smooth'});
  
  if (page === 2) {
    document.getElementById('page-1').classList.add('hidden');
    document.getElementById('page-2').classList.remove('hidden');
    // ปรับให้ body เลื่อนหน้าจอได้ในหน้า 2
    document.body.style.overflowY = 'auto';
  } else {
    document.getElementById('page-2').classList.add('hidden');
    document.getElementById('page-1').classList.remove('hidden');
    // หน้าแรกให้ล็อคไว้ไม่ให้เลื่อนเกินจำเป็น
    document.body.style.overflowY = 'hidden';
  }
}
</script>

</body>
</html>
