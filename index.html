<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 ม่อนตอบหน่อยนะ</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,300&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #f0a3b9;
    --rose-deep: #d65a7f;
    --rose-glow: rgba(240, 163, 185, 0.4);
    --blush: #fff0f5;
    --sky: #c4e1f7;
    --cream: #fbf7f4;
    --text-dark: #2d1f27;
    --text-mid: #6b4e5b;
    --text-light: #a38593;
    --card-bg: rgba(255, 255, 255, 0.45);
    --card-border: rgba(255, 255, 255, 0.7);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--cream) 0%, #f7e6eb 50%, #e6f0fa 100%);
    font-family: 'Sarabun', sans-serif;
    color: var(--text-dark);
    overflow-x: hidden;
    position: relative;
  }

  /* Ambient Blur Background for Depth */
  body::before {
    content: ''; position: fixed; width: 300px; height: 300px;
    background: var(--rose-glow); filter: blur(120px);
    top: 10%; left: 10%; border-radius: 50%; z-index: -1;
  }
  body::after {
    content: ''; position: fixed; width: 400px; height: 400px;
    background: rgba(196, 225, 247, 0.4); filter: blur(150px);
    bottom: 10%; right: 10%; border-radius: 50%; z-index: -1;
  }

  /* ---- Canvas ---- */
  #particles-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  /* ---- Overlay ---- */
  #overlay {
    position: fixed; inset: 0;
    background: var(--cream);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 9999; 
    transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1);
  }
  #overlay.fade-out { 
    opacity: 0; 
    transform: scale(1.05);
    pointer-events: none; 
  }

  .overlay-icon { font-size: 3.5rem; animation: pulse-big 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  @keyframes pulse-big { 0%,100%{transform:scale(1) rotate(0deg)} 50%{transform:scale(1.12) rotate(3deg)} }

  .overlay-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem; font-weight: 400;
    color: var(--text-mid); margin: 20px 0 36px;
    letter-spacing: 0.05em; text-align: center;
    line-height: 1.5;
    padding: 0 20px;
  }

  .start-btn {
    padding: 16px 52px;
    font-family: 'Sarabun', sans-serif;
    font-size: 1rem; font-weight: 600; letter-spacing: 0.1em;
    background: transparent; color: var(--rose-deep);
    border: 2px solid var(--rose-deep);
    border-radius: 50px; cursor: pointer;
    position: relative; overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 15px rgba(214, 90, 127, 0.15);
  }
  .start-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--rose-deep), #e57395);
    transform: scaleX(0); transform-origin: right;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: -1;
  }
  .start-btn:hover::before { transform: scaleX(1); transform-origin: left; }
  .start-btn:hover { color: white; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(214, 90, 127, 0.3); }

  /* ---- Music ---- */
  .music-control {
    position: fixed; top: 24px; right: 24px; z-index: 1000;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,0.6); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.8);
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; font-size: 1.1rem;
    box-shadow: 0 8px 32px rgba(214,90,127,0.1);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .music-control:hover { transform: scale(1.1) rotate(15deg); background: rgba(255,255,255,0.8); }

  /* ---- Main wrapper ---- */
  #app {
    min-height: 100vh; position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
  }

  /* ---- Progress bar ---- */
  .progress-bar-wrap {
    width: 100%; max-width: 540px;
    margin-bottom: 24px;
    padding: 0 8px;
  }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 0.8rem; color: var(--text-light);
    letter-spacing: 0.06em; margin-bottom: 10px;
    font-weight: 600;
  }
  .progress-track {
    height: 6px; background: rgba(240,163,185,0.15);
    border-radius: 20px; overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(to right, var(--rose), var(--rose-deep));
    border-radius: 20px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* ---- Card & Animation Container ---- */
  .card-container {
    width: 100%; max-width: 540px;
    position: relative;
    perspective: 1000px;
  }

  .quiz-card {
    background: var(--card-bg);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 32px;
    padding: 44px 40px;
    width: 100%;
    border: 1px solid var(--card-border);
    box-shadow:
      0 30px 70px rgba(214,90,127,0.08),
      0 10px 30px rgba(0,0,0,0.02),
      inset 0 1px 1px rgba(255,255,255,0.6);
    position: relative; overflow: hidden;
    transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
  }

  /* สไลด์เปลี่ยนคำถามแบบเนียนๆ */
  .slide-out-left { transform: translateX(-30px) scale(0.95); opacity: 0; }
  .slide-in-right { transform: translateX(30px) scale(0.95); opacity: 0; }
  .slide-active { transform: translateX(0) scale(1); opacity: 1; }

  @media (max-width: 480px) {
    .quiz-card { padding: 32px 24px; border-radius: 24px; }
  }

  /* ---- Question ---- */
  .q-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.95rem; font-style: italic; font-weight: 600;
    color: var(--rose-deep); letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  .q-text {
    font-size: 1.6rem; font-weight: 600;
    color: var(--text-dark); line-height: 1.4;
    margin-bottom: 32px;
  }

  /* ---- Divider ---- */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 28px;
  }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, rgba(214,90,127,0.3), transparent); }
  .divider-icon { color: var(--rose-deep); font-size: 0.8rem; opacity: 0.7; }

  /* ---- Options ---- */
  .options { display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }

  .opt-btn {
    padding: 16px 24px;
    border-radius: 20px;
    border: 1.5px solid rgba(240,163,185,0.4);
    background: rgba(255,255,255,0.4);
    color: var(--text-mid);
    font-family: 'Sarabun', sans-serif;
    font-size: 0.98rem; font-weight: 400;
    cursor: pointer; text-align: left;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative; z-index: 1;
  }
  .opt-btn:hover {
    border-color: var(--rose-deep);
    color: var(--rose-deep);
    background: rgba(255, 255, 255, 0.75);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(214,90,127,0.1);
  }
  .opt-btn:active { transform: translateY(0px) scale(0.98); }

  .opt-btn.selected {
    background: linear-gradient(135deg, rgba(240,163,185,0.3) 0%, rgba(196,225,247,0.2) 100%);
    border-color: var(--rose-deep);
    color: var(--rose-deep);
    font-weight: 600;
    box-shadow: 0 8px 25px rgba(214,90,127,0.15), inset 0 1px 2px rgba(255,255,255,0.5);
    padding-left: 36px;
  }
  .opt-btn.selected::before {
    content: '✦'; position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    font-size: 0.8rem; color: var(--rose-deep);
  }

  /* ---- Text input ---- */
  .text-input {
    width: 100%;
    padding: 16px 20px;
    border-radius: 20px;
    border: 1.5px solid rgba(240,163,185,0.4);
    background: rgba(255,255,255,0.5);
    font-family: 'Sarabun', sans-serif;
    font-size: 0.98rem; color: var(--text-dark);
    outline: none; transition: all 0.3s ease;
    resize: none; min-height: 110px;
    margin-bottom: 32px; line-height: 1.6;
  }
  .text-input:focus {
    border-color: var(--rose-deep);
    background: rgba(255,255,255,0.85);
    box-shadow: 0 8px 25px rgba(214,163,185,0.15);
  }

  /* ---- Scale (1-5) ---- */
  .scale-wrap {
    display: flex; gap: 12px;
    justify-content: center;
    margin-bottom: 24px; margin-top: 10px;
  }
  .scale-btn {
    width: 56px; height: 56px; border-radius: 50%;
    border: 1.5px solid rgba(240,163,185,0.4);
    background: rgba(255,255,255,0.4);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem; font-weight: 600; color: var(--text-mid);
    cursor: pointer; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .scale-btn:hover { border-color: var(--rose-deep); color: var(--rose-deep); transform: scale(1.12) translateY(-2px); background: rgba(255,255,255,0.7); }
  .scale-btn:active { transform: scale(0.95); }
  .scale-btn.selected {
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    border-color: var(--rose-deep); color: white;
    box-shadow: 0 8px 25px rgba(214,90,127,0.3);
    transform: scale(1.15);
  }
  .scale-labels {
    display: flex; justify-content: space-between;
    font-size: 0.8rem; color: var(--text-light);
    margin-bottom: 32px; padding: 0 6px; font-weight: 600;
  }

  /* ---- Nav buttons ---- */
  .nav-row { display: flex; gap: 14px; justify-content: flex-end; }
  
  .btn-back {
    padding: 14px 32px; border-radius: 50px;
    border: 1.5px solid rgba(163,133,147,0.3);
    background: transparent; color: var(--text-light);
    cursor: pointer; font-family: 'Sarabun', sans-serif;
    font-size: 0.9rem; font-weight: 600; transition: all 0.3s ease;
  }
  .btn-back:hover { border-color: var(--rose-deep); color: var(--rose-deep); background: rgba(255,255,255,0.3); }

  .btn-next {
    padding: 14px 36px; border-radius: 50px; border: none;
    background: linear-gradient(135deg, var(--rose-deep), #e87a9a);
    color: white; cursor: pointer; font-family: 'Sarabun', sans-serif;
    font-size: 0.9rem; font-weight: 600; letter-spacing: 0.05em;
    box-shadow: 0 8px 25px rgba(214,90,127,0.25);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative; overflow: hidden;
  }
  .btn-next::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer { to { left: 160%; } }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(214,90,127,0.35); }
  .btn-next:active { transform: translateY(0); }

  /* ---- Thank you screen ---- */
  #thank-you {
    display: none; text-align: center; opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #thank-you.show { display: block; opacity: 1; animation: card-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes card-pop { from { transform: scale(0.9) translateY(20px); } to { transform: scale(1) translateY(0); } }
  
  #thank-you .ty-icon { font-size: 4.5rem; margin-bottom: 24px; animation: pulse-big 2.5s ease-in-out infinite; }
  #thank-you h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem; font-weight: 400;
    color: var(--rose-deep); margin-bottom: 16px;
  }
  #thank-you p { color: var(--text-mid); font-size: 1.05rem; line-height: 1.8; }

  /* ---- Petals ---- */
  .petal {
    position: fixed; pointer-events: none; z-index: 0;
    font-size: 1.2rem; opacity: 0;
    animation: petal-fall linear infinite;
  }
  @keyframes petal-fall {
    0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.4; }
    100% { transform: translateY(105vh) translateX(80px) rotate(450deg); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div id="overlay">
  <div class="overlay-icon">💌</div>
  <p class="overlay-title">มีคนอยากรู้จักม่อนมากขึ้น<br>ตอบให้หน่อยนะคะ 🌸</p>
  <button class="start-btn" onclick="init()">เริ่มเลยค่ะ</button>
</div>

<div class="music-control" onclick="toggleMusic()" id="musicBtn">🎵</div>
<audio id="bgMusic" loop>
  <source src="https://files.catbox.moe/i9or96.mp3" type="audio/mpeg">
</audio>

<div id="app">
  <div class="progress-bar-wrap" id="progress-wrap" style="display: none;">
    <div class="progress-label">
      <span id="step-label">คำถาม 1 / 5</span>
      <span id="pct-label">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="card-container">
    <div class="quiz-card slide-active" id="quiz-card" style="display: none;">
      </div>

    <div id="thank-you" class="quiz-card">
      <div class="ty-icon">💗</div>
      <h2>ขอบคุณม่อนมากเลยนะ</h2>
      <div class="divider" style="margin:20px 0">
        <div class="divider-line"></div>
        <div class="divider-icon">✦</div>
        <div class="divider-line"></div>
      </div>
      <p>คำตอบของม่อนส่งไปแล้วค่ะ 🌸<br>รักม่อนที่สุดเลย ❤️</p>
    </div>
  </div>
</div>

<script>
/* ========== CONFIG ========== */
const WEBHOOK = 'https://discord.com/api/webhooks/1504486268761931937/haVDg_sexPQvfQNoS6ET5JkpHQaciQyauDOwGJPs67_HeawXuK2rfqkd-WZWa6Vuhvc0';

const QUESTIONS = [
  {
    id: 'q1',
    type: 'single',
    text: 'ม่อนชอบฉันไหม? 💗',
    options: ['ชอบมากกก 💕', 'ชอบนิดหน่อย', 'ยังไม่แน่ใจ 🤔', 'เฉย ๆ ค่ะ']
  },
  {
    id: 'q2',
    type: 'single',
    text: 'ตอนนี้คิดถึงฉันอยู่ไหม?',
    options: ['คิดถึงตลอดเลย! 🥺', 'คิดถึงอยู่บ้าง', 'เพิ่งนึกถึงพอดี 😊', 'ไม่ได้คิดถึง...']
  },
  {
    id: 'q3',
    type: 'scale',
    text: 'ให้คะแนนความรู้สึกดีที่มีต่อฉันหน่อย?',
    min: 1, max: 5,
    minLabel: 'น้อยมาก', maxLabel: 'มากที่สุด 💗'
  },
  {
    id: 'q4',
    type: 'single',
    text: 'อยากให้ความสัมพันธ์เราเป็นยังไงต่อไป?',
    options: ['อยากคบกัน 💑', 'อยากเป็นเพื่อนสนิทก่อน', 'อยู่แบบนี้ก็ดีแล้ว', 'ยังไม่พร้อมค่ะ']
  },
  {
    id: 'q5',
    type: 'text',
    text: 'อยากบอกอะไรฉันบ้างมั้ย? 🌸',
    placeholder: 'พิมพ์ได้เลยนะคะ...'
  }
];

/* ========== STATE ========== */
let currentStep = 0;
const answers = {};
let music, isPlaying = false;

/* ========== INTERACTIVE PARTICLES MOUSE STATE ========== */
const mouse = { x: null, y: null, radius: 100 };
window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
window.addEventListener('touchmove', (e) => { if(e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } });
window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

/* ========== INIT ========== */
function init() {
  const ov = document.getElementById('overlay');
  ov.classList.add('fade-out');
  setTimeout(() => {
    ov.style.display = 'none';
    document.getElementById('progress-wrap').style.display = 'block';
    document.getElementById('quiz-card').style.display = 'block';
  }, 800);
  
  music = document.getElementById('bgMusic');
  music.play().catch(()=>{});
  isPlaying = true;
  document.getElementById('musicBtn').textContent = '⏸️';
  spawnPetals();
  renderStep(true);
}

function toggleMusic() {
  if (isPlaying) { music.pause(); document.getElementById('musicBtn').textContent = '▶️'; }
  else { music.play(); document.getElementById('musicBtn').textContent = '⏸️'; }
  isPlaying = !isPlaying;
}

/* ========== RENDER WITH SMOOTH ANIMATION ========== */
function renderStep(isInitial = false, direction = 'next') {
  if (currentStep >= QUESTIONS.length) { showThankYou(); return; }

  const q = QUESTIONS[currentStep];
  const total = QUESTIONS.length;
  const pct = Math.round((currentStep / total) * 100);

  document.getElementById('step-label').textContent = `คำถาม ${currentStep + 1} / ${total}`;
  document.getElementById('pct-label').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  const card = document.getElementById('quiz-card');
  
  // สร้างเนื้อหา HTML รอไว้
  let html = `
    <div class="q-num">✦ ข้อที่ ${currentStep + 1}</div>
    <h2 class="q-text">${q.text}</h2>
    <div class="divider"><div class="divider-line"></div><div class="divider-icon">❀</div><div class="divider-line"></div></div>
  `;

  if (q.type === 'single') {
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      const sel = answers[q.id] === opt ? 'selected' : '';
      html += `<button class="opt-btn ${sel}" onclick="selectSingle('${q.id}', this, ${i})">${opt}</button>`;
    });
    html += `</div>`;
  }

  if (q.type === 'scale') {
    html += `<div class="scale-wrap">`;
    for (let v = q.min; v <= q.max; v++) {
      const sel = answers[q.id] == v ? 'selected' : '';
      html += `<button class="scale-btn ${sel}" onclick="selectScale('${q.id}', ${v})">${v}</button>`;
    }
    html += `</div>`;
    html += `<div class="scale-labels"><span>${q.minLabel}</span><span>${q.maxLabel}</span></div>`;
  }

  if (q.type === 'text') {
    const val = answers[q.id] || '';
    html += `<textarea class="text-input" id="text-ans" placeholder="${q.placeholder}" oninput="answers['${q.id}'] = this.value">${val}</textarea>`;
  }

  html += `<div class="nav-row">`;
  if (currentStep > 0) html += `<button class="btn-back" onclick="prevStep()">← ย้อนกลับ</button>`;
  html += `<button class="btn-next" id="btn-next" onclick="nextStep()">`;
  html += currentStep === QUESTIONS.length - 1 ? 'ส่งคำตอบ 💗' : 'ถัดไป →';
  html += `</button></div>`;

  if (isInitial) {
    card.innerHTML = html;
    return;
  }

  // เล่นอนิเมชันตอนเปลี่ยนหน้าลื่นๆ (Slide out -> Change content -> Slide in)
  card.classList.remove('slide-active');
  card.classList.add(direction === 'next' ? 'slide-out-left' : 'slide-in-right');
  
  setTimeout(() => {
    card.innerHTML = html;
    card.classList.remove('slide-out-left', 'slide-in-right');
    card.classList.add(direction === 'next' ? 'slide-in-right' : 'slide-out-left');
    
    requestAnimationFrame(() => {
      card.classList.add('slide-active');
    });
  }, 250);
}

function selectSingle(id, el, idx) {
  answers[id] = QUESTIONS[currentStep].options[idx];
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  
  // หน่วงเวลานิดนึงหลังกด เพื่อให้ผู้ใช้เห็น Feedback แล้วสไลด์ไปข้อถัดไปอัตโนมัติเพื่อความทันสมัย
  setTimeout(() => {
    if (currentStep < QUESTIONS.length - 1 && answers[id]) {
      nextStep();
    }
  }, 400);
}

function selectScale(id, val) {
  answers[id] = val;
  document.querySelectorAll('.scale-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.textContent) === val);
  });
}

function nextStep() {
  const q = QUESTIONS[currentStep];
  if (q.type === 'text') answers[q.id] = document.getElementById('text-ans')?.value || '';
  if (!answers[q.id] && q.type !== 'text') {
    const btn = document.getElementById('btn-next');
    btn.textContent = 'เลือกก่อนนะคะ 🥺';
    setTimeout(() => {
      btn.textContent = currentStep === QUESTIONS.length - 1 ? 'ส่งคำตอบ 💗' : 'ถัดไป →';
    }, 1500);
    return;
  }
  currentStep++;
  renderStep(false, 'next');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevStep() {
  currentStep--;
  renderStep(false, 'prev');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ========== INTERACTIVE PARTICLES SYSTEM ========== */
const canvas = document.getElementById('particles-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height + canvas.height; // เกิดจากด้านล่าง
    this.r = 1.2 + Math.random() * 2.5;
    this.baseAlpha = 0.15 + Math.random() * 0.25;
    this.alpha = this.baseAlpha;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = -0.4 - Math.random() * 0.5;
    this.colorType = Math.random() > 0.5;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;

    // ระบบขยับหนีเมาส์ (Mouse Interaction) เพิ่มมิติความล้ำ
    if (mouse.x !== null && mouse.y !== null) {
      let dx = this.x - mouse.x;
      let dy = this.y - mouse.y;
      let distance = Math.sqrt(dx * dx + dy * dy);
      if (distance < mouse.radius) {
        let force = (mouse.radius - distance) / mouse.radius;
        this.x += (dx / distance) * force * 3;
        this.y += (dy / distance) * force * 3;
      }
    }

    if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.colorType 
      ? `rgba(240,163,185,${this.alpha})`
      : `rgba(196,225,247,${this.alpha})`;
    ctx.fill();
  }
}

for (let i = 0; i < 50; i++) {
  let p = new Particle();
  p.y = Math.random() * canvas.height; // กระจายตัวในตอนแรก
  particles.push(p);
}

(function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animateParticles);
})();

/* ========== BETTER PETALS DROPPING ========== */
const PETALS = ['🌸','💗','✨','🌷'];
function spawnPetals() {
  setInterval(() => {
    if(document.querySelectorAll('.petal').length > 25) return; // จำกัดจำนวนไม่ให้ล้นจอ
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = PETALS[Math.floor(Math.random() * PETALS.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (0.8 + Math.random() * 1) + 'rem';
    p.style.animationDuration = (6 + Math.random() * 8) + 's';
    
    // ลบ Element ทิ้งเมื่อร่วงหล่นเสร็จแล้วเพื่อประหยัด Memory
    p.addEventListener('animationend', () => p.remove());
    document.body.appendChild(p);
  }, 600);
}
